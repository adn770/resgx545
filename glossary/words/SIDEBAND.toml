name = "SIDEBAND.BIT9"
status = "inferred"

[[term.source]]
term = "tilerelative"
kind = "flag"
sgx545 = "sideband bit 9"
meaning = "marks the emit that completes the tile: the PBE counts the emits with it against its tiles. Measured: needed for an emit to complete its tile: with it clear the only emit hangs; an extra emit with it set leaves the PBE queue one emit behind, with it clear for one job only; not tile-relative addressing [infer]"
tier = "3"
source = "mesa-csbgen"
citation = "C0206"
licence = "MIT"
evidence = "[HW] E030: clear, the end-of-tile emit hangs the job; hypothesis of this row's Rogue source (tier 3), tested in E240: PBE tile-relative addressing (Rogue tilerelative, below dither), refuted; [HW] E239: clear on a one-tile target hangs, so not tile-relative; with two emits per tile the first stores the tile, and the second spills into the next job, the queue staying one behind only when it has bit 9; [infer] the reading is ours (E240)"

[[term]]
