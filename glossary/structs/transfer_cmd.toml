[[term.source]]
term = "transfer_cmd.reg_0400"
kind = "field"
sgx545 = "TRANSFERCMD+0x038"
meaning = "Transfer command word 14, which loads register 0x0400: bit 25 inverts bits 31:24 of every pixel a fill or copy writes, and no other bit changed a pixel; over the every-value source exactly the 128 values of bits 31:24 with bit 25 set changed the image"
tier = "ours"
source = "resgx545"
citation = "E029"
licence = "MIT"
evidence = "[HW] E029: flipping bit 25 of word 14 changed all 2048 pixels of the fill (0xff336699 to 0x00336699) and of the copy (0xa5000000 to 0x5a000000); 0xffffffff gave the same hash; no other bit changed a pixel; the 128 values of bits 31:24 with bit 25 set gave one hash and the other 127 the baseline; [infer] the reading is ours, from these runs"
