[[term.source]]
term = "CR_REG_0148"
kind = "register"
sgx545 = "0x0148"
meaning = "a one-bit (bit 0) per-job mode of the 3D and transfer paths for a feature these clients leave off: no value changes a triangle, five copies, a fill or a copy of a shader that writes o0 only (E037, E412); with a shader that writes o1 to o3 as well, bit 0 changes where they land (E406). Measured: per-render word the host supplies with the 3D registers (transfer command and render details); 0 in captures [infer]"
tier = "ours"
source = "resgx545"
citation = "E056"
licence = "MIT"
evidence = "unit not established; [HW] E056: an address into the job's scratch in six forms writes nothing and changes no pixel; [HW] E412: bit 0 at 0 and at 1 gives the same image, stored pages and times in depth, multisampled, large and overflowing renders of shaders that write o0 only; [HW] E406: with a shader that writes a tagged o0 to o7, bit 0 set leaves tags 1, 3, 5, 7 where the plain job leaves tags 1 to 7, and with ISP word 0 bit 26 or 27 and the state block's word 4 at 0x00030001 only tags 1 and 5; [infer] the rest of its reading rests on records still to come"
