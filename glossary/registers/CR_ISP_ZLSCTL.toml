evidence = "[CAP] changes with depth buffers and the external-Z mode (E329, E335); [RE] the EDM sets its load/store bits from the depth/stencil render flags (E163); [HW] E057: bit 0 set lets the render complete with no pixel written; no other bit changes the triangle; [CAP] E336: 0x17100c in the 3D update list a depth test adds; [CAP] E337: bits 1, 13 and 14 are set only when a render loads the depth a previous one stored (0x17700e against 0x17100c); [HW] E058: 0x17100c stores depth and stencil, 0x11700a loads depth and stores nothing"
