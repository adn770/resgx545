meaning = "Word 3 of colour-space set 0, the YUV-to-RGB coefficients a UYVY copy applies: V to R in bits 9:0 and V to G in bits 25:16, signed in 128ths; the limited-range BT.601 numbers are loaded as 0x039800cc (204 and -104)"
tier = "ours"
