evidence = "[HW] E039: threshold bits 15:8, alpha_below bits 23:16 and alpha_above bits 31:24 fit 74 of 77 copies in both runs; the 3 copies with bits 7:0 at 64, 128 and 255 fit none (at 128 and 255 alpha_above came at all 2048 pixels); bits 7:0 at 1 and 0x10 changed nothing; [HW] E038: the word that loads it changed no copy unless T0 bit 31 was set (102 of 102 cases left the target as the baseline); [HW] the luma-key cut probes (texture-luma-cuts, one run): with bits 7:0 at each of 256 values (threshold 128) and nine values at thresholds 0 and 255, alpha_below where low <= luma <= threshold fits every pixel of 272 of 274 copies, 8 pixels 4/1024 above the low cut in the other two; [infer] E039: the threshold and alpha fields are read from a fit, not measured directly"

