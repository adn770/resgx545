citation = "C0174"
licence = "MIT"
evidence = "Rogue ISP_AA (an AA on/off mode) is not linked to it; [HW] E064: in the triangle the low nibble moves pixels of the steep edge only, the high nibble those of the shallow edge; values near 0x88 change nothing; [CAP] E339: 0x88 (one sample at the centre) becomes 0xeaa26e26 with 4x multisampling: four samples, a byte each, x in bits 3:0, y in bits 7:4, a rotated grid; [HW] E064; Apple's AGX packs its sample positions the same way, 0x88 for one sample and 0xeaa26e26 for four (Mesa src/asahi, MIT; another lineage, context only); [HW] E215: with ISP0 bit 28 set, varying it changes a single-sampled object's coverage as the union of its four samples and CR_ISP_SAMPLE_POS's four predicts (counts, not pixels); without it byte 0 alone samples (one run); [infer] mode 1's probes set both words alike, so its source is read from mode 2"

