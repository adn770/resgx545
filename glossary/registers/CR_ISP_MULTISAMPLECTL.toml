meaning = "the pixel's sample positions, a byte per sample (x in bits 3:0, y in bits 7:4, sixteenths of a pixel): 0x88 one sample at the centre, 0xeaa26e26 four in a rotated grid with 4x multisampling (Rogue analogue: PPP_MULTISAMPLECTL)"
tier = "3"
