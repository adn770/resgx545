name = "CR_TE_PSG"
status = "named"

[[term.source]]
term = "ROGUE_CR_TE_PSG"
kind = "register"
sgx545 = "0x0218"
meaning = "tiling-engine control word: bit 22 set on the kick that ends the scene (with the word at 0 the job faults), bit 21 makes the TA mark every target region header (REGION_HDR.FLAGS bit 29), bit 25 with a depth/stencil buffer (Rogue analogue)"
tier = "3"
source = "mesa-csbgen"
citation = "C0301"
licence = "MIT"
evidence = "[CAP] E329 and 15.2 (flush kicks lack bit 22); [RE] the EDM ORs bits 24 and 21 in (E158); role analogue: Rogue's PSG control also has a complete-on-terminate bit (other position); [CAP] E336: bit 25 set with a depth test; [HW] the TE_PSG probes (ta-te-psg, one run): it reads 0x01400000 after every unpoked job, keeps bit 21 set through the TA command and then the region headers carry bit 29; with the command's word at 0 the job faults; [infer] that it faults for want of bit 22 rests on that one value"
