[[term.source]]
term = "CR_HWPERF_COUNTER3"
kind = "register"
sgx545 = "0x0050"
meaning = "HWPerf counter 3: counts the event the selected counter group (CR_HWPERF_CTRL.GROUP) routes to it; zero while no group is selected [infer]"
tier = "ours"
source = "resgx545"
citation = "E150"
licence = "MIT"
evidence = "[RE] E150: SETHWPERFSTATUS selects the counter group in CR_HWPERF_CTRL; [HW] E149: 0 with no group selected; [HW] E359 (platform-hwperf-groups, one run): in group 0 it counts the pixels each job shades, exactly (0x1000 at 64x64, 0x4000 at 128x128, 0x800 for a 64x32 fill), and group 4 the same; other groups count otherwise; [RE] E149: the firmware's HWPerf routine copies 0x0044-0x0064 to its buffer"
