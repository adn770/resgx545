[[term.source]]
term = "CR_REG_0400"
kind = "register"
sgx545 = "0x0400"
meaning = "a pixel output conversion control: bit 25 inverts the alpha channel of every pixel stored, wherever the pack mode puts it (CR_REG_0400.INVERT_BYTE3); bits 7:0 are the threshold of the one-bit alpha of ARGB1555 (pack mode 4) and change no pixel in pack modes 0 to 3, bits 11:8 change no pixel in modes 0 to 4 (E385), 0x80 the default of the other conversions. Measured: per-render word from the render details or transfer command; 0x80 in captures [infer]"
tier = "ours"
source = "resgx545"
citation = "E330"
licence = "MIT"
evidence = "unit not established; [HW] E029: bit 25 inverts bits 31:24 of every pixel written (fill, copy, triangle); no other bit changes a pixel in these jobs; [HW] E028: over an every-value copy no other bit applies a function of the pixel's value; [HW] E385 (pbe-reg-0400-alpha, two runs): in pack mode 4 the stored alpha bit is set where the alpha is above the low byte and clear where it is below, at every pixel of the triangle; bits 8 to 11 change nothing in modes 0 and 4 and bits 7:0 nothing in mode 0; [infer] the rest of its reading rests on records still to come"

