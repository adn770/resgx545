meaning = "a pixel output conversion control: bit 25 inverts the stored alpha in pack modes 0 to 2 and 4 to 6 and changes nothing in the other modes run (CR_REG_0400.INVERT_BYTE3, E1135); bits 7:0 are the threshold of the one-bit alpha of ARGB1555 (pack mode 4: set at or above the low byte, E1136) and change no pixel in any other mode run, bits 11:8 change no pixel in any class run (E385, E1136). Measured: per-render word from the render details or transfer command; 0x80 in captures [infer]"
tier = "ours"
source = "resgx545"
citation = "E330"
licence = "MIT"
evidence = "unit not established; [HW] E029: bit 25 inverts bits 31:24 of every pixel written (fill, copy, triangle); no other bit changes a pixel in these jobs; [HW] E028: over an every-value copy no other bit applies a function of the pixel's value; [HW] E385 (pbe-reg-0400-alpha, two runs): in pack mode 4 the stored alpha bit is set where the alpha is above the low byte and clear where it is below, at every pixel of the triangle; bits 8 to 11 change nothing in modes 0 and 4 and bits 7:0 nothing in mode 0; [HW] E1135 (r34-q044): bit 25 changes the image in modes 4, 5 and 6 only of 4 to 63 but 14; [HW] E1136 (r34-q044): an alpha equal to the low byte stores 1 in mode 4 (nine values), the low byte and 0xf80 change no pixel in the other modes run"

