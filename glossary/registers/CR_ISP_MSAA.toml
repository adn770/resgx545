evidence = "[HW] E210: bits 1:0 = 1 and 2 change the image, 3 hangs; [HW] the multisample layout probes (isp-msaa-layout, isp-msaa-positions, one run): over eight positions of a known edge the 2x1 layout fits every mode 1 image and the 2x2 layout every mode 2 image with no pixel missed, slot k at byte k of 0x04c8, the MTE's word and 0x0520 not used under mode 2; [infer] mode 1's probes set 0x04c8 and the MTE's word alike, so its source is read from mode 2; [infer] E220: other GPUs' anti-aliasing mode fields number the same way, an analogy of ours (no citation record); [HW] E215: 3 still hangs with 0x0520 holding a second grid"

