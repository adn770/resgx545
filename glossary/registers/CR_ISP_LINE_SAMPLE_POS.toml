evidence = "written verbatim by the EDM's 3D kick, partial render and transfer from the per-render register block (RE); [HW] E066: no bit, 0 or ~0 of its word changes a pixel or the visibility registers under a depth test, a translucent or punch-through pass or a bit-exact depth equal; [HW] E067: bit 0 alone is implemented, 0 outside renders; no flip changes a copy or a fill; [HW] E067: no flip, 0 or ~0 changes a textured triangle of ours either; [HW] E068: no flip, 0 or ~0 changes five overlapping copies under depth always, less, translucent or punch-through; [HW] E072: at 0 and 1 the depth less compare against a loaded depth is exact to the ulp; [HW] E073: no change under 42 overlapping triangles per tile, opaque or depth less; [HW] E279: a line moved by 1/16 pixel steps covers x 8-55 / 9-56 switching at 8.5 with 1, x 7-54 / 8-55 switching at 8 with 0; [HW] E279: a column covered when x + 1/2 (1) or x + 1 (0) lies in the line's span and its rows taken at the pixel centre at both values fit all 32 cases of two runs with no pixel missed, while rows taken at (x + 1, y + 1) miss 576 pixels a run; [HW] E291: the polygon offset's units and factor move a sloped depth alike with it at 0 and 1, so it is no depth-bias format"
