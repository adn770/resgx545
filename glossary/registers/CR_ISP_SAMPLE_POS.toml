[[term.source]]
term = "CR_ISP_SAMPLE_POS"
kind = "register"
sgx545 = "0x0520"
meaning = "four more sample positions, laid out as CR_ISP_MULTISAMPLECTL (a byte per sample: x in bits 3:0, y in bits 7:4, sixteenths of a pixel): with ISP0 bit 28 a single-sampled object also covers pixels where one of these samples is inside: the union of eight samples (these four and the four of CR_ISP_MULTISAMPLECTL) predicts every image pixel for pixel; not used to place the samples of a multisampled render; under 4x three values give one image; 0 from the closed driver [infer]"
tier = "ours"
source = "resgx545"
citation = "E214"
licence = "MIT"
evidence = "written verbatim by the EDM's 3D kick, partial render and transfer from the per-render register block (RE); [HW] E066: no bit, 0 or ~0 of its word changes a pixel or the visibility registers under a depth test, a translucent or punch-through pass or a bit-exact depth equal; [HW] E067: all 32 bits implemented; no flip changes a copy or a fill; [HW] E067: no flip, 0 or ~0 changes a textured triangle of ours either; [HW] E068: no flip, 0 or ~0 changes five overlapping copies under depth always, less, translucent or punch-through; [HW] E056: an address into the job's scratch in six forms writes nothing and changes no pixel; [HW] E073: no change under 42 overlapping triangles per tile, opaque or depth less; [infer] E224: not an ISP table base used only when objects index it, as an analogy of ours (no citation record) with Rogue's ISP_SCISSOR/DBIAS/OCLQRY_BASE suggested; [HW] E214: never written by the ISP (poisoned scratch at it); with ISP0 bit 28, 55 values give six images, each reproduced pixel for pixel by the four samples with the pixel centre and top-left corner, and also by the four samples with the centre counted inside on every edge; context only: Apple's AGX packs its sample positions alike (another lineage); [HW] E215: under 4x, 0x0520 at 0, 0x88888888 and 0xffffffff give one image; with 0x04c8 also varied the eight-sample union predicts all four counts, compared as counts and hashes, not pixel for pixel; [HW] the coverage-sample probes (isp-coverage-samples, two runs): with ISP0 bit 28 the eight-sample union predicts all 56 images pixel for pixel; [HW] the multisample position probes (isp-msaa-positions, one run): another word here leaves mode 2's four samples where 0x04c8 puts them"
