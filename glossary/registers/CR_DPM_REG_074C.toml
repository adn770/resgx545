meaning = "the enable (bit 8) of a DPM access near offset 0x6010 of the context's TA-data space, fixed whatever CR_DPM_STATE_BASE1 holds; with that place mapped the job is unchanged; off in every client. Measured: TA command word; 0 in captures [infer]"
