licence = "MIT"
evidence = "written by the EDM's TA kick from the TA command in structure order (RE); [HW] E030, E071, E072, E056: an address into the job's scratch in six forms writes nothing; 0x700 (bit 8) faults; [infer] E206, an analogy of ours (no citation record): an address with an enable bit (AGX 'lsb to enable' registers), refuted; [HW] E203: bit 8 with each of the other bits tried faults at 0x20006011 (0x20006013 once, bit 8 alone, the run's first case, so value and run order are not separated), the page past the context's 0x6000 bytes of RT data: a DPM structure beyond the TA data, not an address; [infer] the reading is ours (E206); [HW] the state-base probes (dpm-state-base, one run): faults at 0x20006010 and 0x20006012 with CR_DPM_STATE_BASE1 at 0x20006000 and at 0x20042000; on a context for up to 4096x4096, whose TA data covers 0x20006000, bit 8 renders the triangle exactly and writes nothing to the DPM pages"
