meaning = "Word 2 of colour-space set 0, the YUV-to-RGB coefficients a UYVY copy applies: U to G in bits 9:0 and U to B in bits 25:16, signed in 128ths; the limited-range BT.601 numbers are loaded as 0x010203ce (-50 and 258)"
