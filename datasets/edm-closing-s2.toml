2b.log run 2, out-s2c.log run 3, stage*.log the stagings); tables/, predictions/ (PREDICTIONS.sha256), score/, gen/, run/, asm/ and bins/ frozen before the first job with FROZEN.sha256 and LAPTOP.sha256 (the laptop's copy), verified before each stage; the freeze rests on file times, hashes and the author's word. Disclosures: README.md and PREFLIGHT.md are the pre-run documents (README.md still says not run; PREFLIGHT.md section 7 calls out/e1c.run2-gate-closed S2 run 1); the frozen scorer takes the tick period as 25001 units where the clock control measured 25000 and its hold guard is symmetric (50 us either side of an old-grid tick), which left every hold of 100000 iterations and above 'cannot tell' (E749); the frozen design put every hold exit 79 to 86 units after a tick of the old grid; the draft analysis records and a scratch assembly (work/try.s) are not in the dataset; tests/ holds the offline mock of the session and the scorer tests (not hardware)"
