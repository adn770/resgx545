s on file times, hashes and the author's word. S1b's tables label S1 post-hoc fits run again as repeat, and every scorer prints held out and repeat only separately. Disclosures: README.md and PREFLIGHT.md are the pre-run documents (README.md says not run, and that the session was prepared in an agent worktree); the runner skips the remaining hypothesis rows of a stage after 3 hang or fault events and a row skipped is void; the scorers carry the S1 fixes; out/mock (offline outputs of the mock tool, not hardware) is not in the dataset; the dotfiles .toolsrc.now and .verify.out are the freeze checker's scratch output; tests/ holds the offline mock tests of the runner and scorers; FROZEN.commits was added on 2026-11-11 (tools/records/frozen.py): it pins the resgx545 files the freeze names by absolute path by commit; the scorer was fixed after the run on 2026-11-11 (audit of the closing scorers, classes C1 to C11; POSTRUN-FIX.md): the frozen scorer is kept as score/*.as-run.py and its outputs out/score-*.txt, the fixed scorer's outputs on the kept records are the *.fixed.txt beside them, FROZEN.pre-fix.sha256 keeps the freeze the run used"
