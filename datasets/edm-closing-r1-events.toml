method = "the session driver of the dataset (run/r1.sh on the Mac, run/stage_r1.sh to stage, run/r1_run.py on the laptop under sudo -n python3, its working directories ~/r1ev and ~/r1ev-out) over ssh on the laptop (host cedar), 2026-11-10 from 09:27 to 09:36 laptop time (08:27 to 08:36 UTC), kernel 7.3.0-resgx545, module srcversion B21FDA82BD5E5CB5A627E3B (installed = loaded), stock firmware (sha256 6a00268e9d4ca552c02e52651a42a2b4db3887d7fe626f209888369985162b0a), tool ~/sgxfive-test-s1b (sha256 46a2d06380814fdb07e7d711376f41fee4af8e6b3f75698d3e2ce52acfd6cc71), regtimeline of S1b; one firmware task of ours, asm/ring_e1.s (S2's event ring with 12 rungs in slot 3, 692 instructions, blob sha256 6e5fd452660c4ff4c99e3251c3b1ec09ce4417a0b604b70c3274a92aae61aa90), verified by the landed tools/fwtask verifier and armed through own_arm for stages k, d0 and d1, and our own loop programs (asm/loop-*.s, assembled by the landed usse-asm, under the stock firmware) for stage t; stages in the order of stages.txt: k (run 1794299244-949, 15 jobs, one arm each; the arm variants nomisc and extra2 made by the runner), t (run 1794299292-1110, 56 jobs, a debugfs reset before each), d0 (run 1794299708-1672, 3 jobs, the gate) and d1 (run 1794299717-1745, 8 jobs, a reset and an arm before each); out/d0-try1 (run 1794299374-1402) is the first run of d0, identical in result, out/d1-try1 (run 1794299383-1475) the first try of d1, stopped after its first job which the runner classed trigfail (its ringtool check read the last 4000 characters of the tool output, which the timeline's samples fill; the probe's 'scene overflowed' line was in the full output), the runner then changed to read the whole output and the files refrozen with PREDICTIONS.sha256 byte-identical, and d0 and d1 were run again; the first attempt of the session (out-r1.log, 08:16 Mac time) stopped at stage k's preflight with no sgx debugfs directory found and ran no job; out/STAGE/ holds per job NAME.json (the results page twice,