method = "the planned 204 jobs (Part A 191 on the unchanged tool sgxfive-test-1135, Part B 13 on sgxfive-test-1139 built on the laptop from the 11.35 source with three options added, T2 to T4 of analysis/plan.md; T1, the probe's depth scratch, not implemented, no case uses it) run by hand over ssh on the laptop (direct cable) with the frozen run_table.sh and lib1139.sh in line ranges of each table (scripts/chunk1139.sh: the harness caps a foreground call), one directory of dumps a range under dumps/: the whole raw output of every job and every dump gzipped with its raw sha256 (raw.sha256, 2523 files checked), cases.tsv, kernel.log (journalctl -k, one case marker a job), output/ the run logs, scripts/, analysis/ (plan.md, declared.tsv, predictions-declared.tsv, hashes.txt, the tables, the generator, the frozen recompute and its output recompute-frozen.out, the corrected copy recompute-b with its outputs, the analysis scripts and outputs, tool-changes and tool-tests, followup-a and followup-b with their declared files and hashes written before those runs). Disclosures. The frozen recompute scored 312 hits, 97 misses and 106 \"no data\" of 515 predictions; recompute-b scores 395, 102 and 18. The frozen file reads the page table at dump offset 0x423000 and page p at p * 4096 although the dump starts at slot offset 0x1000 (E309's free-list.sh: PT = 0x423000 - 0x1000), and reads the depth buffer of a two-render job from depth.1.bin (the 18 ov-* jobs have only depth.2.bin); the rows that changed are H-walk, H-head, H-first and H-free-O of the pool (\"no data\" or a miss frozen) and H-dload-yes (4), H-dload-no (4), H-min (10) and H45-R (8 with H45-L) of the depth and owner tables (\"no data\" frozen). recompute-b corrects both and has one defect of its own, a 28th group of its repeatability list (ow-keep) that merges ow-keep-a and ow-keep-b through its -[ab] pattern, a mistake of the regular expression (new file, own hash in analysis/; the frozen file and every declared file are unchanged and their hashes verified before the first run). The tool refused two wide cases (800 and 850 vertices are not whole triangles: rc 2 with the usage text, kept in wide-risky.c4) and they were rerun as 801 and 849 vertices under new names (wide-risky.rerun). follow-up a (10 jobs) and b (9 jobs) were declared and hashed after the batch and before they ran. The order of the hashes and the runs rests on the author's word and on the case markers of the kernel journal (kernel.log); the declared files carry one copy time and nothing else in the data shows the order. No kernel or module change or reload, no reboot, no register written (no kreg, kregnow, clock-gate register or trc_hazard), own_arm off."
