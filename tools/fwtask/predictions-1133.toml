id = "P33_T32"
declared = "TRC 32 (trc_hazard=1) arms and the job runs: done within 100 ms, r123 reads back the job's own marker, r0 reads 0, the tick advances (900 to 1100 Hz), EVENT_STATUS2 is 0x400, no BIF fault, the gate is exact after"
