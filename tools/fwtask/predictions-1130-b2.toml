#
# Phase 11.30 stage B2 predictions, frozen before its first run. classify.py reads only this file.

[[row]]
id = "B2_armonly"
stage = "B2"
declared = "after cmd 2 (the writer that only arms the reader and tail-calls) the pclink and p1 read at the next event are the preceding control's, in 3 of 3 rounds"
falsifier = "pclink 6 or p1 changed after a writer that wrote nothing: the event with a command (not our values) is what differs"
expect = "all(a == b for a, b in zip(pcl_next, pcl_ctl)) and all(a == b for a, b in zip(p1_next, p1_ctl))"

[[row]]
id = "B2_ponly"
stage = "B2"
declared = "after cmd 3 (p0 to p3 only) the pclink read at the next event is 6 and p1 is 0 (ours), in 3 of 3 rounds"
falsifier = "the control's pclink or p1: the predicates are not what changes the closed task's path"
expect = "all(a == 6 for a in pcl_next) and all(a == 0 for a in p1_next)"

[[row]]
id = "B2_saonly"
stage = "B2"
declared = "after cmd 4 (sa, r, i only, no predicates) the pclink and p1 read at the next event are the control's, 3 of 3"
falsifier = "pclink 6: the sa, r or i values change the closed task's path"
expect = "all(a == b for a, b in zip(pcl_next, pcl_ctl)) and all(a == b for a, b in zip(p1_next, p1_ctl))"

[[row]]
id = "B2_full"
stage = "B2"
declared = "after cmd 1 (everything, as stage B) pclink is 6 and p1 is 0 again, 3 of 3"
falsifier = "the control's values: stage B's reading does not repeat"
expect = "all(a == 6 for a in pcl_next) and all(a == 0 for a in p1_next)"

[[row]]
id = "B2_sa63_65"
stage = "B2"
declared = "after cmd 1 and cmd 4 sa63 and sa65 read at the next event are the markers written (6 of 6)"
falsifier = "any other value: sa64 is not the only sa that does not stick"
expect = "sa_extra == sa_extra_marked"

[[row]]
id = "B2_sa64"
stage = "B2"
declared = "sa64 reads 2 at the next event after cmd 1 and cmd 4 (our write of sa64 does not stick, 6 of 6)"
falsifier = "sa64 reads our marker, or any other value"
expect = "all(a == 2 for a in sa64_next)"
