# What the kernel does with each word userspace submits, read from the kernel fork's code:
# the transfer command (xfer:0-41, struct drm_sgxfive_transfer_cmd) and the render command
# (cmd:0-25, struct drm_sgxfive_render_cmd). The sweep report (sweep.py) uses it to tell a
# case that never reached the GPU from one that did.
#
#   action    pass      copied unchanged into the firmware command
#             validate  checked: a value that breaks the rule fails the submission (-EINVAL),
#                       nothing runs; a value that keeps it is copied unchanged
#             mask      only the bits of `mask` reach the firmware command
#             override  the kernel writes its own value; the word never reaches the GPU
#   lands     where the word lands in the firmware command the kernel builds, as the
#             kernel-poke spaces address it: tq:N (transfer command), ta:N (the TA command
#             of a render), rd:N (its render details)
#   ref       file:line in drivers/gpu/drm/gma500/sgxfive/ at the commit `fork` names
#   mask      validate: the bits that pass the check; mask: the bits that survive
#
# No word is masked or overridden today: the kernel only rejects. Besides the per-word
# checks, both commands are rejected when shorter than their version 1 size, longer than a
# page, misaligned (8 bytes), or longer than the kernel knows with a non-zero tail
# (sgxfive_submit.c:111, :151; the tail rule is copy_elem, :36).
fork = "linux fork, branch resgx545 at b1089172b2e7"

[[word]]
word = "xfer:0"
action = "pass"
lands = ["tq:0"]
ref = "sgxfive_cmd.c:70"

