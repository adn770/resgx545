host = "tri"
slot = "pixel"
size = [64, 64]
pixels = true
inputs = ["OP"]
blk = { 1 = 0x1d00200 }
cmd = { 12 = 0xf0100 }
cases = [["mov.skipinv.end o0, #0xFF00FF00"]]
