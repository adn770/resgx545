needs = ["render", "kpoke"]

[[probe]]
name = "isp-stencil-blkadd-clip-full"
question = "grown block: region clip of the whole 64x64 surface"
source = "pix_op.s"
host = "tri"
slot = "pixel"
size = [64, 64]
pixels = true
inputs = ["OP"]
cases = [["mov.skipinv.end o0, #0xFF00FF00"]]
labels = ["x-blkadd-clip-full"]
blk_add = { 7 = [0x80000001, 3] }

[[probe]]
name = "isp-stencil-blkadd-clip-tile"
