# isp bit28 modes: 14 probes (written once for 11.15, not regenerated).
# Q031: ISP word 0 bit 28 under the multisample modes with 0x0520 clear and set, one case a probe.
needs = ["render", "kpoke"]

[[probe]]
name = "isp-bit28-modes-m1-s0"
question = "ISP word 0 bit 28 under mode 1 with 0x0520 at 0x0, one case"
source = "pix_op.s"
host = "tri"
slot = "pixel"
blk = { 1 = 0x11d00200 }
cmd = { 10 = 0xeaa26e26, 13 = 0x80000001, 16 = 0xeaa26e26 }
kpoke = ["rd:19=0x0"]
size = [0x40, 0x40]
pixels = true
inputs = ["OP"]
labels = ["mode 1, 0x0520 0x0"]
cases = [["mov.skipinv.end o0, #0xFF00FF00"]]

