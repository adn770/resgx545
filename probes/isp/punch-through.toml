host = "tri"
slot = "pixel"
slots = { pixpds = "pds_iter_pt.s", vtxuse = "vtx_z.s" }
vtx_coords = 2
vertices = 15
copy_depth = true
blk = { 1 = 0x8400200 }
size = [64, 64]
pixels = true
temps = 4
inputs = ["OP"]
cases = [["atst8.end r3, !p0, pa0, r2, r1, fb"], ["atst8.end r3, !p0, pa0, r2, r1, optdwd"], ["atst8.end r3, !p0, pa0, r2, r1, twosided, fb"], ["atst8.end r3, !p0, pa0, r2, r1, twosided, optdwd"]]
labels = ["fb (control)", "optdwd", "twosided, fb", "twosided, optdwd"]

