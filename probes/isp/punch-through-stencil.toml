[[probe]]
name = "isp-punch-through-stencil-ptread-op-replace"
question = "control: the first object opaque, stencil op replace: where does the second object (stencil equal 0x55) draw"
source = "pix_op.s"
host = "tri"
slot = "pixel"
slots = { pixpds = "pds_iter_pt.s", vtxuse = "vtx_z.s" }
vtx_coords = 2
vertices = 6
copy_depth = true
size = [64, 64]
pixels = true
temps = 4
inputs = ["OP"]
blk = { 1 = 0x400355 }
isp2 = 0xe02ffff
obj2 = { first = 3, blk = { 1 = 0x1d00355, 3 = 0x400ff00 }, pixel = "pix_blue.s" }
cases = [["mov.skipinv.end o0, #0xFF00FF00"]]
labels = ["control: the first object opaque, stencil op replace"]

