# isp punch through repeat: 33 probes (written once for 11.15, not regenerated).
# Q032, Q072: the pcoeff variants five times, and 0x04dc bit 1 on discarding and pcoeff-only punch
# scenes.
needs = ["render", "kpoke"]

[[probe]]
name = "isp-punch-through-repeat-pcoeff-pt2-punch-pcoeff-only-r1"
question = "the punch scene with pix_pt2.s and pds_iter_pt1.s: which copies draw"
source = "pix_pt2.s"
host = "tri"
slot = "pixel"
slots = { pixpds = "pds_iter_pt1.s", vtxuse = "vtx_z.s" }
vtx_coords = 2
vertices = 0xf
copy_depth = true
blk = { 1 = 0x8400200 }
size = [0x40, 0x40]
pixels = true
temps = 4
inputs = ["OP"]
cases = [["atst8.end r3, !p0, pa0, r2, r1, fb"]]
labels = ["always fb"]

