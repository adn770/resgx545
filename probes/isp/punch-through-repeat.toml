[[probe]]
name = "isp-punch-through-repeat-04dc-discard-0-r1"
question = "the discarding punch scene with 0x04dc = 0"
source = "pix_pt4.s"
host = "tri"
slot = "pixel"
slots = { pixpds = "pds_iter_pt1.s", vtxuse = "vtx_z.s" }
vtx_coords = 2
vertices = 0xf
copy_depth = true
blk = { 1 = 0x8400200 }
size = [0x40, 0x40]
pixels = true
temps = 8
inputs = ["OP"]
cases = [["mov.skipinv r4, #0x00008000\natst8.end r3, !p0, pa0, r2, r4, fb"], ["mov.skipinv r4, #0x3E002000\natst8.end r3, !p0, pa0, r2, r4, fb"], ["mov.skipinv r4, #0x00000000\natst8.end r3, !p0, pa0, r2, r4, fb"]]
labels = ["greater 0x00: copy 0 fails", "less 0x3e: copies 2-4 fail", "never: all fail"]
kpoke = ["rd:21=0"]

