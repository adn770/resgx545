# isp msaa: 0 sweeps, 10 probes, hand-run script.
name = "isp-msaa"
needs = ["render", "kpoke"]
open = ["isp-msaa-bit48-1", "isp-msaa-bit48-1-4x", "isp-msaa-bit48-2", "isp-msaa-bit48-2-4x"]
script = "msaa.sh"

[[probe]]
name = "isp-msaa-plain"
question = "what the end-of-tile program eot_plain.s stores"
source = "pix_op.s"
host = "tri"
slot = "pixel"
slots = { eot = "eot_plain.s" }
size = [64, 64]
pixels = true
inputs = ["OP"]
cases = [["mov.skipinv.end o0, #0xFF00FF00"]]
labels = ["eot_plain"]

[[probe]]
name = "isp-msaa-plain-4x"
question = "what the end-of-tile program eot_plain.s stores from a 4x multisampled render"
source = "pix_op.s"
host = "tri"
slot = "pixel"
slots = { eot = "eot_plain.s" }
cmd = { 1 = 0xe0000000, 10 = 0xeaa26e26, 13 = 0x80000002, 16 = 0xeaa26e26 }
size = [64, 64]
pixels = true
inputs = ["OP"]
cases = [["mov.skipinv.end o0, #0xFF00FF00"]]
labels = ["eot_plain, 4x"]

