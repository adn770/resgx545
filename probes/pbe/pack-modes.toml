# pbe pack modes: 0 sweeps, 73 probes.
needs = ["render"]

[[probe]]
name = "pbe-pack-modes-packmode-00"
question = "what sideband 0x200 stores (pack mode 0)"
source = "pix_op.s"
host = "tri"
slot = "pixel"
slots = { eot = "eot_plain.s" }
sideband = 512
size = [64, 64]
pixels = true
inputs = ["OP"]
cases = [["mov.skipinv.end o0, #0x80FF8040"]]
labels = ["pack mode 0"]

