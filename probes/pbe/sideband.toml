# pbe sideband: 0 sweeps, 30 probes.
needs = ["render"]
open = ["pbe-sideband-0200-32x16", "pbe-sideband-0000-32x32", "pbe-sideband-0000-64x16", "pbe-sideband-two-0000-0200", "pbe-sideband-two-0200-0200", "pbe-sideband-two-0200-0000", "pbe-sideband-two-0203-0200", "pbe-sideband-two-0203-0000", "pbe-sideband-two-0200-0003"]

[[probe]]
name = "pbe-sideband-0200"
question = "what sideband 0x200 does to the stored image (the default: bit 9, ARGB8888)"
source = "pix_op.s"
host = "tri"
slot = "pixel"
slots = { eot = "eot_plain.s" }
sideband = 512
size = [64, 64]
pixels = true
inputs = ["OP"]
cases = [["mov.skipinv.end o0, #0x00FF8040"]]
labels = ["the default: bit 9, ARGB8888"]

