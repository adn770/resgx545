sideband = 0x207
size = [0x40, 0x40]
pixels = true
inputs = ["OP"]
cases = [["mov.skipinv.end o0, #0xC0804020"], ["mov.skipinv.end o0, #0x13579BDF"]]
labels = ["o0 0xc0804020", "o0 0x13579bdf"]

