# pbe sideband fields: 0 sweeps, 67 probes (written by tools/usse-asm/pbe_words.py).
# SIDEBAND bits 8:6 under MSAA, partial modes, 128x128 (Q046).
needs = ["render"]

[[probe]]
name = "pbe-sideband-fields-msaa1-0200"
question = "what sideband 0x200 stores under CR_ISP_MSAA mode 1"
source = "pix_op.s"
host = "tri"
slot = "pixel"
slots = { eot = "eot_plain.s" }
sideband = 0x200
size = [0x40, 0x40]
pixels = true
inputs = ["OP"]
cmd = { 10 = 0xeaa26e26, 16 = 0xeaa26e26, 13 = 0x80000001 }
cases = [["mov.skipinv.end o0, #0x80FF8040"]]
labels = ["bits 8:6 = 0, MSAA mode 1"]

