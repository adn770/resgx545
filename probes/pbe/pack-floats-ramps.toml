# pbe pack floats ramps: 0 sweeps, 3 probes (written by tools/usse-asm/pbe_words.py).
# pack modes 22 and 34 with x and y ramps in o0, o1 (Q012).
needs = ["render"]

[[probe]]
name = "pbe-pack-floats-ramps-mode0"
question = "what pack mode 0 stores for o0 = x/128, o1 = 0.5 + y/128, o2 = 0.3, o3 = 0.9 and each ramp alone"
source = "pix_xy_op.s"
host = "tri"
slot = "pixel"
slots = { eot = "eot_plain.s", pixpds = "pds_iter_xy.s", vtxuse = "vtx_coords.s" }
sideband = 0x200
size = [0x40, 0x40]
pixels = true
inputs = ["OP"]
vtx_coords = 2
cases = [["mov.skipinv r1, #0x3C000000\nmov.skipinv r2, #0x00000000\nmov.skipinv r3, #0x3F000000\nfmad.skipinv o0, pa0, r1, r2\nfmad.skipinv o1, pa1, r1, r3\nmov.skipinv o2, #0x3E99999A\nmov.skipinv.end o3, #0x3F666666"], ["mov.skipinv r1, #0x3C000000\nmov.skipinv r2, #0x00000000\nmov.skipinv r3, #0x3F000000\nmov.skipinv o1, #0\nmov.skipinv o2, #0\nmov.skipinv o3, #0\nfmad.skipinv.end o0, pa0, r1, r2"], ["mov.skipinv r1, #0x3C000000\nmov.skipinv r2, #0x00000000\nmov.skipinv r3, #0x3F000000\nmov.skipinv o0, #0\nmov.skipinv o2, #0\nmov.skipinv o3, #0\nfmad.skipinv.end o1, pa1, r1, r3"], ["mov.skipinv r1, #0x3C000000\nmov.skipinv r2, #0x00000000\nmov.skipinv r3, #0x3F000000\nfmad.skipinv o0, pa0, r1, r2\nfmad.skipinv o1, pa1, r1, r3\nmov.skipinv o2, #0x3E99999A\nmov.skipinv.end o3, #0x3F666666"], ["mov.skipinv r1, #0x3C000000\nmov.skipinv r2, #0x00000000\nmov.skipinv r3, #0x3F000000\nmov.skipinv o1, #0\nmov.skipinv o2, #0\nmov.skipinv o3, #0\nfmad.skipinv.end o0, pa0, r1, r2"], ["mov.skipinv r1, #0x3C000000\nmov.skipinv r2, #0x00000000\nmov.skipinv r3, #0x3F000000\nmov.skipinv o0, #0\nmov.skipinv o2, #0\nmov.skipinv o3, #0\nfmad.skipinv.end o1, pa1, r1, r3"]]
labels = ["run 1: o0 = x/128, o1 = 0.5 + y/128, o2 = 0.3, o3 = 0.9", "run 1: o0 = x/128, o1-o3 = 0", "run 1: o1 = 0.5 + y/128, o0, o2, o3 = 0", "run 2: o0 = x/128, o1 = 0.5 + y/128, o2 = 0.3, o3 = 0.9", "run 2: o0 = x/128, o1-o3 = 0", "run 2: o1 = 0.5 + y/128, o0, o2, o3 = 0"]

