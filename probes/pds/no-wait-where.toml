# pds no-wait where: 2 probes.
# Q027: the shader of the no-wait iteration probes (pds_iter_nowait.s, E393) copying each of pa0 to
# pa15 in turn to o0, three runs each, against the waited iteration's pa0 to pa3 (pds_iter_wait.s):
# where the unwaited douti's values go.
needs = ["render"]

[[probe]]
name = "pds-no-wait-where-no-wait"
question = "what pa0 to pa15 hold at each pixel after a douti without the wait"
source = "pix_op.s"
host = "tri"
slot = "pixel"
slots = { pixpds = "pds_iter_nowait.s", vtxuse = "vtx_coords.s" }
vtx_coords = 2
size = [0x40, 0x40]
pixels = true
inputs = ["OP"]
