# pds iteration waits: 0 sweeps, 12 probes.
needs = ["render"]

[[probe]]
name = "pds-iteration-waits-persp-bits"
question = "whether the iteration is perspective-correct, and which DOUTI0 bit changes it (w 1.25-2.75)"
source = "pds_tex_iter.s"
host = "tri"
slot = "pixpds"
slots = { pixel = "pix_pa0.s", vtxuse = "vtx_persp.s" }
vtx_coords = 2
size = [64, 64]
pixels = true
inputs = ["A", "B", "U"]
cases = [[0x40000801, 0, 0x2000004], [0x40020801, 0, 0x2000004], [0x40040801, 0, 0x2000004], [0x40080801, 0, 0x2000004], [0x40100801, 0, 0x2000004], [0x40200801, 0, 0x2000004], [0x41000801, 0, 0x2000004], [0x42000801, 0, 0x2000004], [0x44000801, 0, 0x2000004], [0x60000801, 0, 0x2000004], [0xc0000801, 0, 0x2000004]]
labels = ["base: source 1, the fetch from set 1", "bit 17", "bit 18", "bit 19", "bit 20", "bit 21", "bit 24", "bit 25", "bit 26", "bit 29", "bit 31"]

