# pds iter wait textured: 0 sweeps, 4 probes.
# E364 asks whether the DOUTU1 bit 24 the closed driver sets with an iteration is needed;
# a textured primary with an iterated colour (its douti with and without DOUTI0 bit 29), its U1 with
# and without bits 24 and 25, pa0 to pa3 read, three runs.
needs = ["render"]

