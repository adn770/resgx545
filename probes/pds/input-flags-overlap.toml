# pds input flags overlap: 0 sweeps, 2 probes. if0 and if1 in the primary pixel program with the triangle drawn
# twice and five times over itself (Q058); three runs each.
needs = ["render"]

[[probe]]
question = "if0, if1 in the primary pixel program, per pixel, with 2 copies of the triangle over each other: x + 0.5 where the flag held; recorded"
source = "pds_iter_if.s"
host = "tri"
slot = "pixpds"
slots = { pixel = "pix_pa0.s", vtxuse = "vtx_coords.s" }
vtx_coords = 0x2
size = [0x40, 0x40]
pixels = true
params = { A = "0x20000800", C = "0x20000000", U = "0x01000004", M = "0" }
inputs = ["OP"]
name = "pds-input-flags-overlap-x2"
vertices = 0x6
labels = ["run 1: control: source 1 everywhere", "run 1: control: source 0 everywhere", "run 1: if0", "run 1: if1", "run 2: control: source 1 everywhere", "run 2: control: source 0 everywhere", "run 2: if0", "run 2: if1", "run 3: control: source 1 everywhere", "run 3: control: source 0 everywhere", "run 3: if0", "run 3: if1"]
cases = [["nop"], ["mov32 ds0[48], ds0[4]"], ["(if0) mov32 ds0[48], ds0[4]"], ["(if1) mov32 ds0[48], ds0[4]"], ["nop"], ["mov32 ds0[48], ds0[4]"], ["(if0) mov32 ds0[48], ds0[4]"], ["(if1) mov32 ds0[48], ds0[4]"], ["nop"], ["mov32 ds0[48], ds0[4]"], ["(if0) mov32 ds0[48], ds0[4]"], ["(if1) mov32 ds0[48], ds0[4]"]]

[[probe]]
question = "if0, if1 in the primary pixel program, per pixel, with 5 copies of the triangle over each other: x + 0.5 where the flag held; recorded"
source = "pds_iter_if.s"
host = "tri"
slot = "pixpds"
slots = { pixel = "pix_pa0.s", vtxuse = "vtx_coords.s" }
vtx_coords = 0x2
size = [0x40, 0x40]
pixels = true
params = { A = "0x20000800", C = "0x20000000", U = "0x01000004", M = "0" }
inputs = ["OP"]
name = "pds-input-flags-overlap-x5"
vertices = 0xf
labels = ["run 1: control: source 1 everywhere", "run 1: control: source 0 everywhere", "run 1: if0", "run 1: if1", "run 2: control: source 1 everywhere", "run 2: control: source 0 everywhere", "run 2: if0", "run 2: if1", "run 3: control: source 1 everywhere", "run 3: control: source 0 everywhere", "run 3: if0", "run 3: if1"]
cases = [["nop"], ["mov32 ds0[48], ds0[4]"], ["(if0) mov32 ds0[48], ds0[4]"], ["(if1) mov32 ds0[48], ds0[4]"], ["nop"], ["mov32 ds0[48], ds0[4]"], ["(if0) mov32 ds0[48], ds0[4]"], ["(if1) mov32 ds0[48], ds0[4]"], ["nop"], ["mov32 ds0[48], ds0[4]"], ["(if0) mov32 ds0[48], ds0[4]"], ["(if1) mov32 ds0[48], ds0[4]"]]
