# pds iter wait colour: 0 sweeps, 10 probes.
# Q093: textured primaries that iterate the vertex colour (DOUTI0 source 32) or several attribute
# registers before the fetch: shape P the colour alone, shape Q the colour then a two-component
# coordinate set, shape R a three-component coordinate set; the last iteration with and without
# the completion bit, DOUTU1 with and without bits 24 and 25 (bit 24 only with the completion
# bit, which it needs), pa0 to pa3 read, three runs each.
