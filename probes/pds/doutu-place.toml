# pds doutu place: 6 probes.
# E428: a USE program (colour 0x61) placed 64 KiB, 1 MiB and 4 MiB above the code heap's base and
# started in place of the fill shader (colour 0xBA5E, at the base) by a primary DOUTU with the
# offset in EXE and CBASE (cbase: bits 18:3 and 22:19) or as an 18-bit EXE (exe18: bits 20:3,
# CBASE 0), three runs of each (sgxfive-test probe --place, --place-form). The 64 KiB placement is
# reached by both readings; at 4 MiB only CBASE reaches the program and exe18's EXE is 0.
needs = ["render"]

[[probe]]
name = "pds-doutu-place-64k-cbase"
question = "which program runs when the fill's DOUTU starts the program placed 0x10000 above the code heap base, written as cbase"
source = "place_base.s"
place = { offset = 0x10000, source = "place_use.s", form = "cbase" }
temps = 32
inputs = ["RUN"]
labels = ["run 1", "run 2", "run 3"]
cases = [[1], [2], [3]]

[[probe]]
name = "pds-doutu-place-64k-exe18"
question = "which program runs when the fill's DOUTU starts the program placed 0x10000 above the code heap base, written as exe18"
source = "place_base.s"
place = { offset = 0x10000, source = "place_use.s", form = "exe18" }
temps = 32
inputs = ["RUN"]
labels = ["run 1", "run 2", "run 3"]
cases = [[1], [2], [3]]

