# pds pixel event: 0 sweeps, 14 probes.
needs = ["render"]

[[probe]]
name = "pds-pixel-event-readback"
question = "the pixel-event program's douta reaches the sa0-sa15 of the plain task it starts"
source = "pixev_dump.s"
host = "tri"
slot = "pixev"
slots = { pixtask = "task_dump.s" }
size = [32, 16]
temps = 8
params = { OP = "movs douta, ds0[10], ds1[10], ds0[10], ds0[10]\nmovs douta, ds0[11], ds1[11], ds0[11], ds0[11]\nmovs douta, ds0[12], ds1[12], ds0[12], ds0[12]\nmovs douta, ds0[13], ds1[13], ds0[13], ds0[13]\nmovs douta, ds0[14], ds1[14], ds0[14], ds0[14]\nmovs douta, ds0[15], ds1[15], ds0[15], ds0[15]\nmovs douta, ds0[16], ds1[16], ds0[16], ds0[16]\nmovs douta, ds0[17], ds1[17], ds0[17], ds0[17]\nmovs douta, ds0[18], ds1[18], ds0[18], ds0[18]\nmovs douta, ds0[19], ds1[19], ds0[19], ds0[19]\nmovs douta, ds0[20], ds1[20], ds0[20], ds0[20]\nmovs douta, ds0[21], ds1[21], ds0[21], ds0[21]\nmovs douta, ds0[22], ds1[22], ds0[22], ds0[22]\nmovs douta, ds0[23], ds1[23], ds0[23], ds0[23]\nmovs douta, ds0[24], ds1[24], ds0[24], ds0[24]\nmovs douta, ds0[25], ds1[25], ds0[25], ds0[25]\nmovs doutu, ds0[0], ds0[1], ds0[0], ds0[0]\n" }
labels = ["32x16, one tile"]
cases = [[]]
[probe.hypotheses]
"douta writes the sa0-sa15 of the task started next" = [[0x7e570000, 0x7e570001, 0x7e570002, 0x7e570003, 0x7e570004, 0x7e570005, 0x7e570006, 0x7e570007, 0x7e570008, 0x7e570009, 0x7e57000a, 0x7e57000b, 0x7e57000c, 0x7e57000d, 0x7e57000e, 0x7e57000f]]

[[probe]]
