# pds encoding bits: 0 sweeps, 5 probes (written by tools/usse-asm/pds_bits.py).
# Each probe flips one unmapped bit of a form per case; case 0 is the base word.
needs = ["render"]

[[probe]]
name = "pds-encoding-bits-flow-bra"
question = "which unmapped bits of '{0}bra {1}' the hardware reads (0x00f80000), base 'bra skip', recorded; may hang"
isa = "pds"
source = "pds_bits.s"
params = { A = "0x11111111", B = "0x22222222", C = "0x80000003", D = "0x00000000", E = "0x55555555", F = "0x66666666", G = "0x77777777", H = "0x0000FF01", I = "0x99999999", J = "0xAAAAAAAA", K = "0x00000000", L = "0x8000000B", M = "0xCCCCCCCC", N = "0xDDDDDDDD", O = "0xEEEEEEEE", P = "0x00010203" }
inputs = ["OP", "POST", "END"]
labels = ["base", "bit 19", "bit 20", "bit 21", "bit 22", "bit 23"]
cases = [[".word /* base */ 0x97000012\nmov32 ds0[52], ds1[48]\nskip: mov32 ds0[53], ds1[49]", "nop", "halt"], [".word /* bit 19 */ 0x97080012\nmov32 ds0[52], ds1[48]\nskip: mov32 ds0[53], ds1[49]", "nop", "halt"], [".word /* bit 20 */ 0x97100012\nmov32 ds0[52], ds1[48]\nskip: mov32 ds0[53], ds1[49]", "nop", "halt"], [".word /* bit 21 */ 0x97200012\nmov32 ds0[52], ds1[48]\nskip: mov32 ds0[53], ds1[49]", "nop", "halt"], [".word /* bit 22 */ 0x97400012\nmov32 ds0[52], ds1[48]\nskip: mov32 ds0[53], ds1[49]", "nop", "halt"], [".word /* bit 23 */ 0x97800012\nmov32 ds0[52], ds1[48]\nskip: mov32 ds0[53], ds1[49]", "nop", "halt"]]

