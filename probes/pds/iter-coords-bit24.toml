# pds iter coords bit24: 0 sweeps, 15 probes.
# Q093: DOUTU1 bit 24 with and without the fetch wait (bit 25) on textured primaries whose
# coordinate registers carry the vertex's coordinates (iter-coords-sized): a coordinate set
# alone, the vertex colour then a two-component set, then a three-component set, pa0 to pa3
# (pa4 for the three-component set) read, three runs of each U1; then 30 jobs with bits 24 and
# 25 on the colour then two-component shapes, for the one hang E454 saw.
needs = ["render"]

