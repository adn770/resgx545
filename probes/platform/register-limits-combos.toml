# platform register limits, by bits 10:8: 0 probes (a script, register-limits-combos.sh).
# Q001: which values of 0x0818 draw the second of two triangles of different sizes wrongly
# (register-limits-values: 0x100, 0x1ff and 0x3ff do, 0x7ff does not): bits 10:8 in all eight
# combinations with a low byte of 0x00, 0x7f and 0xff, the pairs 96 then 128 and 128 then 96,
# three times.
needs = ["render", "kreg"]
name = "platform-register-limits-combos"
script = "register-limits-combos.sh"
