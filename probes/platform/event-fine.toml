# platform event fine: 1 probe, a script (event-steps.sh).
# Q082: when CR_EVENT_STATUS2 bit 6 latches, between 48 and 56 loop iterations of the pixel
# program (eight instructions an iteration, six integer multiply-adds), in steps of 1, each after a
# reset, three runs.
needs = ["render", "reset"]
name = "platform-event-fine"
script = "event-fine.sh"

[[probe]]
name = "platform-event-fine-int"
question = "a fill whose pixel program loops N times over eight instructions, six integer multiply-adds among them"
source = "int_loop.s"
inputs = ["ITER"]
labels = ["48 iterations", "49 iterations", "50 iterations", "51 iterations", "52 iterations", "53 iterations", "54 iterations", "55 iterations", "56 iterations"]
cases = [[48], [49], [50], [51], [52], [53], [54], [55], [56]]
