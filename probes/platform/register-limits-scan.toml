# and at 0x3ff; every fourth value of 0x0818 (0 to 0x7ff) and every value with bit 8 set and bit 10 clear
# around a 256x256 triangle (the full 2048 values wrapped the kernel ring); the single bits and
# their complements of 0x0814 and 0x0810 around it; the failing values again at 128x128.
needs = ["render", "kreg"]
