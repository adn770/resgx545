# platform event trigger: 8 probes, a script (event-trigger.sh).
# Q082: when CR_EVENT_STATUS2 bit 6 latches: fills whose pixel program loops 16 to 12500 times
# (eight instructions an iteration), integer and floating-point, each after a reset that
# clears the bit.
needs = ["render", "reset"]
name = "platform-event-trigger"
script = "event-trigger.sh"

[[probe]]
name = "platform-event-trigger-int-16"
question = "a fill whose pixel program loops 16 times over eight instructions, six integer multiply-adds among them"
source = "int_loop.s"
inputs = ["ITER"]
labels = ["16 iterations"]
cases = [[16]]

