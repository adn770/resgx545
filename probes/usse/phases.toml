# usse phases: 0 sweeps, 63 probes.
needs = ["render"]

[[probe]]
name = "usse-phases-filladdr"
question = "the fill shader's own absolute instruction index, from pclink after a call"
source = "value.s"
params = { A = 0, B = 0, C = 0, D = 0 }
inputs = ["OP", "OUT"]
labels = ["br.savelink #1, then mov r20, pclink", "the same again"]
cases = [["br.savelink #0x00000001\nmov r20, pclink", "r20"], ["br.savelink #0x00000001\nmov r20, pclink", "r20"]]

[[probe]]
name = "usse-phases-fillbar-parallel"
question = "a two-phase fill, first phas none, parallel: do quads that skip phase 0's spin read their block's marker"
source = "fill_phas_bar.s"
params = { MODE = "parallel" }
pixels = true
temps = 8
inputs = ["X"]
labels = ["run 1", "run 2"]
cases = [["0"], ["1"]]

[[probe]]
name = "usse-phases-fillbar-perinstance"
