[[probe]]
name = "usse-fmad-round"
question = "fmad rounding: ties with even and odd last bit, positive and negative"
source = "value.s"
params = { OP = "fmad r4, r1, r2, r3", OUT = "r4", C = 0, D = 0 }
inputs = ["A", "B"]
labels = ["(1+2^-12)^2, tie to even", "(1+2^-12)(1+3*2^-12), tie, odd", "the same, negative"]
cases = [[0x3f800800, 0x3f800800], [0x3f800800, 0x3f801800], [0xbf800800, 0x3f801800]]
[probe.hypotheses]
"to nearest, ties to even" = [0x3f801000, 0x3f802002, 0xbf802002]
"toward zero" = [0x3f801000, 0x3f802001, 0xbf802001]
"to nearest, ties away" = [0x3f801001, 0x3f802002, 0xbf802002]
"toward -inf" = [0x3f801000, 0x3f802001, 0xbf802002]
"toward +inf" = [0x3f801001, 0x3f802002, 0xbf802001]

[[probe]]
name = "usse-fmad-fused"
question = "fmad a * b + c: one rounding (fused) or two"
source = "value.s"
params = { OP = "fmad r4, r1, r2, r3", OUT = "r4", D = 0 }
inputs = ["A", "B", "C"]
cases = [[0x3f800800, 0x3f800800, 0xbf801000]]
[probe.hypotheses]
"fused (one rounding)" = [0x33800000]
"product rounded first" = [0]

[[probe]]
name = "usse-fmad-denormal"
question = "fmad with a denormal result or input: kept or flushed to zero"
source = "value.s"
params = { OP = "fmad r4, r1, r2, r3", OUT = "r4", C = 0, D = 0 }
inputs = ["A", "B"]
labels = ["2^-70 * 2^-70 (2^-140)", "2^-140 (input) * 2^100", "-2^-70 * 2^-70"]
cases = [[0x1c800000, 0x1c800000], [0x200, 0x71800000], [0x9c800000, 0x1c800000]]
[probe.hypotheses]
"denormals kept" = [0x200, 0x2b800000, 0x80000200]
"flushed to zero (results and inputs)" = [0, 0, { o0_not = 0x80000200 }]
"results flushed, inputs kept" = [0, 0x2b800000, { o0_not = 0x80000200 }]
"inputs flushed, results kept" = [0x200, 0, 0x80000200]

[[probe]]
name = "usse-fmad-zero-sign"
question = "fmad: signs of zero results and of flushed denormals"
source = "value.s"
params = { OP = "fmad r4, r1, r2, r3", OUT = "r4", D = 0 }
inputs = ["A", "B", "C"]
labels = ["-1 * 0 + -0", "-1 * 0 + 0", "1 * 1 + -1", "-2^-70 * 2^-70 + -0", "-denormal * 1 + -0", "-denormal * 1 + 0"]
cases = [[0xbf800000, 0, 0x80000000], [0xbf800000, 0, 0], [0x3f800000, 0x3f800000, 0xbf800000], [0x9c800000, 0x1c800000, 0x80000000], [0x80000200, 0x3f800000, 0x80000000], [0x80000200, 0x3f800000, 0]]
[probe.hypotheses]
"IEEE zeros, denormals flushed keeping their sign" = [0x80000000, 0, 0, 0x80000000, 0x80000000, 0]
"IEEE zeros, denormals flushed to +0" = [0x80000000, 0, 0, 0, 0, 0]
