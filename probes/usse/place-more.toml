# cases 1 and 2 of the 11.25 follow-up: placed programs at non-aligned offsets, false calls placed. Phase 11.25.
# each probe's source is the placed program under templates/ (E428's --place, cbase form), run twice
needs = ["render"]

[[probe]]
name = "usse-place-more-read-2ff000"
question = "the link of a br.savelink in a program placed at heap offset 0x2ff000 (cbase), read as o0 (model: the code base is the placement rounded down to 0x80000 bytes, and the program starts at the offset inside the step: E476)"
source = "place_base.s"
place = { offset = 0x002ff000, source = "p25_link_read.s", form = "cbase" }
temps = 0x00000020
inputs = ["RUN"]
labels = ["run 1", "run 2"]
cases = [[0x00000001], [0x00000002]]
[probe.hypotheses]
"step of 0x80000 bytes (65536 instructions): the 11.23 reading" = [0x0000fe02, 0x0000fe02]
"step of 0x100000 bytes" = [0x0001fe02, 0x0001fe02]
"step of 0x40000 bytes" = [0x00007e02, 0x00007e02]

[[probe]]
name = "usse-place-more-jump-2ff000"
question = "a lapc to link + 8 computed at run time in a program placed at heap offset 0x2ff000 (cbase): o0 = the link when it lands, 0xFA11 when it falls through (model: the code base is the placement rounded down to 0x80000 bytes, and the program starts at the offset inside the step: E476)"
source = "place_base.s"
place = { offset = 0x002ff000, source = "p25_link_jump.s", form = "cbase" }
temps = 0x00000020
inputs = ["RUN"]
labels = ["run 1", "run 2"]
cases = [[0x00000001], [0x00000002]]
[probe.hypotheses]
"step of 0x80000 bytes (65536 instructions): the 11.23 reading" = [0x0000fe02, 0x0000fe02]
"step of 0x100000 bytes" = [0x0001fe02, 0x0001fe02]
"step of 0x40000 bytes" = [0x00007e02, 0x00007e02]

