# usse emitpds (item 14): 0 sweeps, 26 probes (one case each; may hang or fault).
needs = ["render", "vm_low"]

[[probe]]
name = "usse-emitpds-control"
question = "emitpds in a fill shader naming the PDS secondary of the fill: no emitpds at all: what the fill's own run of the PDS program leaves in dword 0"
source = "emit_pds.s"
isa = "pds"
use = "emit_control.s"
low = 0x10000
coords = true
temps = 32
params = { SRC = "ir0.0" }
inputs = ["A"]
labels = ["no emitpds at all: what the fill's own run of the PDS program leaves in dword 0"]
cases = [[0xC0DE0001]]

