question = "iadd32.testnat.chan0 !c0, p0, r1, r2 where sext16(r1) + r2 overflows 32 bits as a signed sum: the test of the wrapped 32-bit sum (model) or of the true sum (case 9 of the first run: r1=0x7fff r2=0x7fffffff gave n clear)"
source = "dump.s"
params = { OUT = "r10", OP = "iadd32.testnat.chan0 !c0, p0, r1, r2\nmov r10, #0\np0 mov r10, #1", C = 0x00000000, D = 0x00000000, E = 0x00000000, F = 0x00000000, G = 0x00000000, H = 0x00000000 }
inputs = ["A", "B"]
labels = ["r1=0x00007fff r2=0x7fffffff", "r1=0x00000001 r2=0x7fffffff", "r1=0x00008000 r2=0x80000000", "r1=0x0000ffff r2=0x80000000", "r1=0x00008000 r2=0x80008000", "r1=0x00007fff r2=0x7fff0000", "r1=0x00000001 r2=0xffffffff", "r1=0x0000ffff r2=0x00000001", "r1=0x00000001 r2=0x7ffffffe", "r1=0x00008000 r2=0x80000001", "r1=0x0000ffff r2=0xffffffff", "r1=0x00007fff r2=0x80000000"]
cases = [[0x00007fff, 0x7fffffff], [0x00000001, 0x7fffffff], [0x00008000, 0x80000000], [0x0000ffff, 0x80000000], [0x00008000, 0x80008000], [0x00007fff, 0x7fff0000], [0x00000001, 0xffffffff], [0x0000ffff, 0x00000001], [0x00000001, 0x7ffffffe], [0x00008000, 0x80000001], [0x0000ffff, 0xffffffff], [0x00007fff, 0x80000000]]
[probe.hypotheses]
