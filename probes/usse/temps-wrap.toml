# usse registers past the allocation read back as the wrapped register: 0 sweeps, 4 probes.
needs = ["render"]

[[probe]]
name = "usse-temps-wrap-t008"
question = "--temps 8: only r(n mod 8) is written, r(n) is read"
source = "temps.s"
temps = 8
params = {  }
inputs = ["SET", "GET", "OUT"]
labels = ["--temps 8: r2 = marker only, read r10 (pixel) and r2 (dword 0)", "--temps 8: r3 = marker only, read r11 (pixel) and r3 (dword 0)", "--temps 8: r2 = marker only, read r18 (pixel) and r2 (dword 0)", "--temps 8: r5 = marker only, read r29 (pixel) and r5 (dword 0)"]
cases = [["mov.skipinv r2, #0x7E5710C2", "stad [r1,+#0], r2", "r10"], ["mov.skipinv r3, #0x7E5710C3", "stad [r1,+#0], r3", "r11"], ["mov.skipinv r2, #0x7E5710C2", "stad [r1,+#0], r2", "r18"], ["mov.skipinv r5, #0x7E5710C5", "stad [r1,+#0], r5", "r29"]]
[probe.hypotheses]
"a read past the allocation returns the register index modulo the allocation" = [{ o0 = 0x7E5710C2, dwords = [0x7E5710C2] }, { o0 = 0x7E5710C3, dwords = [0x7E5710C3] }, { o0 = 0x7E5710C2, dwords = [0x7E5710C2] }, { o0 = 0x7E5710C5, dwords = [0x7E5710C5] }]
"a register past the allocation is storage of its own (not the low register's value)" = [{ o0_not = 0x7E5710C2, dwords = [0x7E5710C2] }, { o0_not = 0x7E5710C3, dwords = [0x7E5710C3] }, { o0_not = 0x7E5710C2, dwords = [0x7E5710C2] }, { o0_not = 0x7E5710C5, dwords = [0x7E5710C5] }]

