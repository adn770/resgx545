[[probe]]
name = "usse-instance-masking-skipinv-inst"
question = "which instances of a fill run an instruction without .skipinv (Rogue: only enabled instances unless (ignorepe)); only o0 and temporaries written, no stores"
source = "coords.s"
coords = true
pixels = true
params = {  }
inputs = ["PRE", "OP", "OUT"]
labels = ["mov r10, r3 without .skipinv over r10 = 0x0BAD0000", "control: mov.skipinv r10, r3", "mov o0, r3 without .skipinv over o0 = 0x0BAD0000 (the final mov copies o0)", "or r10, r3, #0 without .skipinv over r10 = 0x0BAD0000"]
cases = [["mov.skipinv r10, #0x0BAD0000", "mov r10, r3", "r10"], ["mov.skipinv r10, #0x0BAD0000", "mov.skipinv r10, r3", "r10"], ["mov.skipinv o0, #0x0BAD0000", "mov o0, r3", "o0"], ["mov.skipinv r10, #0x0BAD0000", "or r10, r3, #0", "r10"]]
[probe.hypotheses]
"every instance of the full 64x32 fill runs an instruction without .skipinv" = [{ quad = [[0, 0], [0, 1], [0, 2], [0, 3]] }, { quad = [[0, 0], [0, 1], [0, 2], [0, 3]] }, { quad = [[0, 0], [0, 1], [0, 2], [0, 3]] }, { quad = [[0, 0], [0, 1], [0, 2], [0, 3]] }]
"an instruction without .skipinv runs for no instance of a fill" = [0xbad0000, { quad = [[0, 0], [0, 1], [0, 2], [0, 3]] }, 0xbad0000, 0xbad0000]

[[probe]]
name = "usse-instance-masking-skipinv-grad"
question = "do the quad gradients fdsx/fdsy differ with and without .skipinv (Rogue: the gradient sample needs (ignorepe) to see every quad instance); only o0 and temporaries written"
source = "coords.s"
coords = true
pixels = true
params = {  }
inputs = ["PRE", "OP", "OUT"]
labels = ["fdsx r10, r3, r3 over r10 = 0x0BAD0000", "fdsx.skipinv r10, r3, r3 over r10 = 0x0BAD0000", "fdsy r10, r3, r3 over r10 = 0x0BAD0000", "fdsy.skipinv r10, r3, r3 over r10 = 0x0BAD0000"]
cases = [["mov.skipinv r10, #0x0BAD0000", "fdsx r10, r3, r3", "r10"], ["mov.skipinv r10, #0x0BAD0000", "fdsx.skipinv r10, r3, r3", "r10"], ["mov.skipinv r10, #0x0BAD0000", "fdsy r10, r3, r3", "r10"], ["mov.skipinv r10, #0x0BAD0000", "fdsy.skipinv r10, r3, r3", "r10"]]
