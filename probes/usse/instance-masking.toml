# usse instance masking: 0 sweeps, 8 probes.
needs = ["render"]

[[probe]]
name = "usse-instance-masking-setm"
question = "setm #n before a mov without .skipinv: which pixels it writes"
source = "wide_dump.s"
temps = 48
pixels = true
params = { OUT = "r20" }
inputs = ["OP"]
labels = ["no setm", "setm #0", "setm #1", "setm #2", "setm #3", "setm #4", "setm #5", "setm #6", "setm #7", "setm #8", "setm #9", "setm #10", "setm #11", "setm #12", "setm #13", "setm #14", "setm #15", "setm #0, .skipinv mov", "setm #5, .skipinv mov", "setm #15, .skipinv mov", "setm #1, two movs", "setm #2, two movs", "setm #3, two movs"]
cases = [["mov r20, #0x0A0A0A0A"], ["setm #0\nmov r20, #0x0A0A0A0A"], ["setm #1\nmov r20, #0x0A0A0A0A"], ["setm #2\nmov r20, #0x0A0A0A0A"], ["setm #3\nmov r20, #0x0A0A0A0A"], ["setm #4\nmov r20, #0x0A0A0A0A"], ["setm #5\nmov r20, #0x0A0A0A0A"], ["setm #6\nmov r20, #0x0A0A0A0A"], ["setm #7\nmov r20, #0x0A0A0A0A"], ["setm #8\nmov r20, #0x0A0A0A0A"], ["setm #9\nmov r20, #0x0A0A0A0A"], ["setm #10\nmov r20, #0x0A0A0A0A"], ["setm #11\nmov r20, #0x0A0A0A0A"], ["setm #12\nmov r20, #0x0A0A0A0A"], ["setm #13\nmov r20, #0x0A0A0A0A"], ["setm #14\nmov r20, #0x0A0A0A0A"], ["setm #15\nmov r20, #0x0A0A0A0A"], ["setm #0\nmov.skipinv r20, #0x0A0A0A0A"], ["setm #5\nmov.skipinv r20, #0x0A0A0A0A"], ["setm #15\nmov.skipinv r20, #0x0A0A0A0A"], ["setm #1\nmov r21, #0x0B0B0B0B\nmov r20, #0x0A0A0A0A"], ["setm #2\nmov r21, #0x0B0B0B0B\nmov r20, #0x0A0A0A0A"], ["setm #3\nmov r21, #0x0B0B0B0B\nmov r20, #0x0A0A0A0A"]]

[[probe]]
