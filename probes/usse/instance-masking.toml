inputs = ["OP"]
labels = ["skipinv blue, then plain green (1)", "skipinv blue, then plain green (2)", "skipinv blue, then plain green (3)", "plain blue, then skipinv green (1)", "plain blue, then skipinv green (2)", "plain blue, then skipinv green (3)", "plain green only (1)", "plain green only (2)", "plain green only (3)", "skipinv green only (1)", "skipinv green only (2)", "skipinv green only (3)"]
