needs = ["render"]

[[probe]]
name = "usse-branch-bexc-none"
question = "no bexception (control): which markers land"
source = "wide_dump.s"
temps = 48
pixels = true
params = { OUT = "r20" }
inputs = ["OP"]
labels = ["no bexception (control)"]
cases = [["mov r20, #0x0A0A0A0A\nmov r21, #0x0B0B0B0B"]]

[[probe]]
name = "usse-branch-bexc"
question = "bexception between the markers: which markers land"
