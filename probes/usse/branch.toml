temps = 48
pixels = true
params = { OUT = "r20" }
inputs = ["OP"]
labels = ["bexception between the markers"]
cases = [["mov r20, #0x0A0A0A0A\nbexception #0x00000000\nmov r21, #0x0B0B0B0B"]]

