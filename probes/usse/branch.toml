[[probe]]
name = "usse-branch-divergent"
question = "what a predicated br does when a quad's instances disagree (Rogue: .ALLINST/.ANYINST branch modes; .synce/.syncent/.mon are open): p0 instances should store 4, the others 7"
source = "coords.s"
coords = true
pixels = true
params = {  }
inputs = ["PRE", "OP", "OUT"]
labels = ["x parity within the quad (g25 & 1 == 0), p0 br #3", "x parity within the quad (g25 & 1 == 0), p0 br.synce #3", "x parity within the quad (g25 & 1 == 0), p0 br.syncent #3", "x parity within the quad (g25 & 1 == 0), p0 br.mon #3", "x parity within the quad (g25 & 1 == 0), p0 br.nosched #3", "tile row bit 3, uniform per quad (g24 & 8 == 0), p0 br #3", "tile row bit 3, uniform per quad (g24 & 8 == 0), p0 br.synce #3", "tile row bit 3, uniform per quad (g24 & 8 == 0), p0 br.syncent #3", "tile row bit 3, uniform per quad (g24 & 8 == 0), p0 br.mon #3", "tile row bit 3, uniform per quad (g24 & 8 == 0), p0 br.nosched #3", "x parity inverted: p0 on odd x (instance 0 clear), p0 br #3", "p0 on instances 1-3 of the quad (g25 & 3 != 0), p0 br #3"]
cases = [["mov.skipinv r10, #0\nmov.skipinv r9, #1\nand.skipinv.testtaz.chan0 !c0, p0, g25, r9", "p0 br #3\nor r10, r10, #1\nor r10, r10, #2\nor r10, r10, #4", "r10"], ["mov.skipinv r10, #0\nmov.skipinv r9, #1\nand.skipinv.testtaz.chan0 !c0, p0, g25, r9", "p0 br.synce #3\nor r10, r10, #1\nor r10, r10, #2\nor r10, r10, #4", "r10"], ["mov.skipinv r10, #0\nmov.skipinv r9, #1\nand.skipinv.testtaz.chan0 !c0, p0, g25, r9", "p0 br.syncent #3\nor r10, r10, #1\nor r10, r10, #2\nor r10, r10, #4", "r10"], ["mov.skipinv r10, #0\nmov.skipinv r9, #1\nand.skipinv.testtaz.chan0 !c0, p0, g25, r9", "p0 br.mon #3\nor r10, r10, #1\nor r10, r10, #2\nor r10, r10, #4", "r10"], ["mov.skipinv r10, #0\nmov.skipinv r9, #1\nand.skipinv.testtaz.chan0 !c0, p0, g25, r9", "p0 br.nosched #3\nor r10, r10, #1\nor r10, r10, #2\nor r10, r10, #4", "r10"], ["mov.skipinv r10, #0\nmov.skipinv r9, #8\nand.skipinv.testtaz.chan0 !c0, p0, g24, r9", "p0 br #3\nor r10, r10, #1\nor r10, r10, #2\nor r10, r10, #4", "r10"], ["mov.skipinv r10, #0\nmov.skipinv r9, #8\nand.skipinv.testtaz.chan0 !c0, p0, g24, r9", "p0 br.synce #3\nor r10, r10, #1\nor r10, r10, #2\nor r10, r10, #4", "r10"], ["mov.skipinv r10, #0\nmov.skipinv r9, #8\nand.skipinv.testtaz.chan0 !c0, p0, g24, r9", "p0 br.syncent #3\nor r10, r10, #1\nor r10, r10, #2\nor r10, r10, #4", "r10"], ["mov.skipinv r10, #0\nmov.skipinv r9, #8\nand.skipinv.testtaz.chan0 !c0, p0, g24, r9", "p0 br.mon #3\nor r10, r10, #1\nor r10, r10, #2\nor r10, r10, #4", "r10"], ["mov.skipinv r10, #0\nmov.skipinv r9, #8\nand.skipinv.testtaz.chan0 !c0, p0, g24, r9", "p0 br.nosched #3\nor r10, r10, #1\nor r10, r10, #2\nor r10, r10, #4", "r10"], ["mov.skipinv r10, #0\nmov.skipinv r9, #1\nand.skipinv.testtanz.chan0 !c0, p0, g25, r9", "p0 br #3\nor r10, r10, #1\nor r10, r10, #2\nor r10, r10, #4", "r10"], ["mov.skipinv r10, #0\nmov.skipinv r9, #3\nand.skipinv.testtanz.chan0 !c0, p0, g25, r9", "p0 br #3\nor r10, r10, #1\nor r10, r10, #2\nor r10, r10, #4", "r10"]]

