# usse the emitpds addend (item 14, E488): the base emit with other addends, one probe each (risky: every emit job faulted or hung in 11.24): 0 sweeps, 19 probes.
needs = ["render", "vm_low"]

[[probe]]
name = "usse-emit-addend-a00000"
question = "emitpds.tasks.taske #0 with s0 = 2 rows and the addend 0x0, naming the fill PDS secondary: does the PDS program run (dword 0 reads 3 or 2 after the emit) and does the job fault"
source = "emit_pds.s"
isa = "pds"
use = "emit_a00000.s"
low = 0x10000
coords = true
temps = 32
params = { SRC = "ir0.0" }
inputs = ["A"]
labels = ["addend 0x0"]
cases = [[0xC0DE0001]]

