# usse filter bank 2: 0 sweeps, 2 probes. Fixed bank 2's sets 2 and 3 on a lifted line: the
# positive tap's byte raised so that the result sits above 0, then every other byte raised
# and lowered by 0x20 in turn, so that a negative tap shows as a lower result (E080).
needs = ["render"]

