# usse gradients: 0 sweeps, 2 probes.
needs = ["render"]

[[probe]]
name = "usse-gradients-fds-quad"
question = "fdsx/fdsy: which pixels of the 2x2 quad the two sources come from"
source = "coords.s"
coords = true
pixels = true
params = {  }
inputs = ["PRE", "OP", "OUT"]
labels = ["fdsx r10, r3, r7: a = mark, b = 0", "fdsx r10, r7, r3.neg: a = 0, b = -mark", "fdsy r10, r3, r7: a = mark, b = 0", "fdsy r10, r7, r3.neg: a = 0, b = -mark", "fdsx r10, r20, r20: a = b = 1 + p/2048", "fdsy r10, r20, r20: a = b = 1 + p/2048"]
cases = [["or.skipinv r20, r1, #0x3F800000", "fdsx r10, r3, r7", "r10"], ["or.skipinv r20, r1, #0x3F800000", "fdsx r10, r7, r3.neg", "r10"], ["or.skipinv r20, r1, #0x3F800000", "fdsy r10, r3, r7", "r10"], ["or.skipinv r20, r1, #0x3F800000", "fdsy r10, r7, r3.neg", "r10"], ["or.skipinv r20, r1, #0x3F800000", "fdsx r10, r20, r20", "r10"], ["or.skipinv r20, r1, #0x3F800000", "fdsy r10, r20, r20", "r10"]]
[probe.hypotheses]
"coarse: fdsx d, a, b = a(TR) - b(TL) and fdsy = a(BL) - b(TL), for all four pixels of the quad" = [{ quad = [[0, 1], [0, 1], [0, 1], [0, 1]] }, { quad = [[0, 0], [0, 0], [0, 0], [0, 0]] }, { quad = [[0, 2], [0, 2], [0, 2], [0, 2]] }, { quad = [[0, 0], [0, 0], [0, 0], [0, 0]] }, 0x3a000000, 0x3d000000]
"fine: each pixel's own row (fdsx) or column (fdsy): a(right or bottom) - b(left or top)" = [{ quad = [[0, 1], [0, 1], [0, 3], [0, 3]] }, { quad = [[0, 0], [0, 0], [0, 2], [0, 2]] }, { quad = [[0, 2], [0, 3], [0, 2], [0, 3]] }, { quad = [[0, 0], [0, 1], [0, 0], [0, 1]] }, 0x3a000000, 0x3d000000]
"roles swapped: a(TL) - b(TR), a(TL) - b(BL)" = [{ quad = [[0, 0], [0, 0], [0, 0], [0, 0]] }, { quad = [[0, 1], [0, 1], [0, 1], [0, 1]] }, { quad = [[0, 0], [0, 0], [0, 0], [0, 0]] }, { quad = [[0, 2], [0, 2], [0, 2], [0, 2]] }, 0xba000000, 0xbd000000]
"the pixel's neighbour minus itself: a(x ^ 1) - b(x), a(y ^ 1) - b(y)" = [{ quad = [[0, 1], [0, 0], [0, 3], [0, 2]] }, { quad = [[0, 0], [0, 1], [0, 2], [0, 3]] }, { quad = [[0, 2], [0, 3], [0, 0], [0, 1]] }, { quad = [[0, 0], [0, 1], [0, 2], [0, 3]] }, { o0_not = 0x3a000000 }, { o0_not = 0x3d000000 }]

[[probe]]
name = "usse-gradients-fds-incs"
question = "fdsx/fdsy .repeat2 with .incsXYZ: which source each bit advances"
source = "dump.s"
params = { A = 0, B = 0, C = 0, D = 0, E = 0, F = 0, G = 0, H = 0, OUT = "r10" }
inputs = ["OP", "A", "B", "C", "D", "E", "F", "G", "H"]
labels = ["fdsx.repeat2", "fdsy.repeat2", "fdsx.repeat2.incs111", "fdsy.repeat2.incs111", "fdsx.repeat2.incs001", "fdsy.repeat2.incs001", "fdsx.repeat2.incs010", "fdsy.repeat2.incs010", "fdsx.repeat2.incs100", "fdsy.repeat2.incs100", "fdsx.repeat2.incs011", "fdsy.repeat2.incs011"]
cases = [["fdsx.repeat2 r10, r1, r3", 0x3f800000, 0x40000000, 0x40800000, 0x41000000, 0x41800000, 0x42000000, 0, 0], ["fdsy.repeat2 r10, r1, r3", 0x3f800000, 0x40000000, 0x40800000, 0x41000000, 0x41800000, 0x42000000, 0, 0], ["fdsx.repeat2.incs111 r10, r1, r3", 0x3f800000, 0x40000000, 0x40800000, 0x41000000, 0x41800000, 0x42000000, 0, 0], ["fdsy.repeat2.incs111 r10, r1, r3", 0x3f800000, 0x40000000, 0x40800000, 0x41000000, 0x41800000, 0x42000000, 0, 0], ["fdsx.repeat2.incs001 r10, r1, r3", 0x3f800000, 0x40000000, 0x40800000, 0x41000000, 0x41800000, 0x42000000, 0, 0], ["fdsy.repeat2.incs001 r10, r1, r3", 0x3f800000, 0x40000000, 0x40800000, 0x41000000, 0x41800000, 0x42000000, 0, 0], ["fdsx.repeat2.incs010 r10, r1, r3", 0x3f800000, 0x40000000, 0x40800000, 0x41000000, 0x41800000, 0x42000000, 0, 0], ["fdsy.repeat2.incs010 r10, r1, r3", 0x3f800000, 0x40000000, 0x40800000, 0x41000000, 0x41800000, 0x42000000, 0, 0], ["fdsx.repeat2.incs100 r10, r1, r3", 0x3f800000, 0x40000000, 0x40800000, 0x41000000, 0x41800000, 0x42000000, 0, 0], ["fdsy.repeat2.incs100 r10, r1, r3", 0x3f800000, 0x40000000, 0x40800000, 0x41000000, 0x41800000, 0x42000000, 0, 0], ["fdsx.repeat2.incs011 r10, r1, r3", 0x3f800000, 0x40000000, 0x40800000, 0x41000000, 0x41800000, 0x42000000, 0, 0], ["fdsy.repeat2.incs011 r10, r1, r3", 0x3f800000, 0x40000000, 0x40800000, 0x41000000, 0x41800000, 0x42000000, 0, 0]]
[probe.hypotheses]
"Y advances a (source 1), Z advances b (source 2), X neither (source 0); no flags advance both" = [[0xc0400000, 0xc0c00000, 0xa8a9aaab, 0xacadaeaf, 0xb0b1b2b3, 0xb4b5b6b7, 0xb8b9babb, 0xbcbdbebf], [0xc0400000, 0xc0c00000, 0xa8a9aaab, 0xacadaeaf, 0xb0b1b2b3, 0xb4b5b6b7, 0xb8b9babb, 0xbcbdbebf], [0xc0400000, 0xc0c00000, 0xa8a9aaab, 0xacadaeaf, 0xb0b1b2b3, 0xb4b5b6b7, 0xb8b9babb, 0xbcbdbebf], [0xc0400000, 0xc0c00000, 0xa8a9aaab, 0xacadaeaf, 0xb0b1b2b3, 0xb4b5b6b7, 0xb8b9babb, 0xbcbdbebf], [0xc0400000, 0xc0e00000, 0xa8a9aaab, 0xacadaeaf, 0xb0b1b2b3, 0xb4b5b6b7, 0xb8b9babb, 0xbcbdbebf], [0xc0400000, 0xc0e00000, 0xa8a9aaab, 0xacadaeaf, 0xb0b1b2b3, 0xb4b5b6b7, 0xb8b9babb, 0xbcbdbebf], [0xc0400000, 0xc0000000, 0xa8a9aaab, 0xacadaeaf, 0xb0b1b2b3, 0xb4b5b6b7, 0xb8b9babb, 0xbcbdbebf], [0xc0400000, 0xc0000000, 0xa8a9aaab, 0xacadaeaf, 0xb0b1b2b3, 0xb4b5b6b7, 0xb8b9babb, 0xbcbdbebf], [0xc0400000, 0xc0400000, 0xa8a9aaab, 0xacadaeaf, 0xb0b1b2b3, 0xb4b5b6b7, 0xb8b9babb, 0xbcbdbebf], [0xc0400000, 0xc0400000, 0xa8a9aaab, 0xacadaeaf, 0xb0b1b2b3, 0xb4b5b6b7, 0xb8b9babb, 0xbcbdbebf], [0xc0400000, 0xc0c00000, 0xa8a9aaab, 0xacadaeaf, 0xb0b1b2b3, 0xb4b5b6b7, 0xb8b9babb, 0xbcbdbebf], [0xc0400000, 0xc0c00000, 0xa8a9aaab, 0xacadaeaf, 0xb0b1b2b3, 0xb4b5b6b7, 0xb8b9babb, 0xbcbdbebf]]
"Y advances b, Z a" = [[0xc0400000, 0xc0c00000, 0xa8a9aaab, 0xacadaeaf, 0xb0b1b2b3, 0xb4b5b6b7, 0xb8b9babb, 0xbcbdbebf], [0xc0400000, 0xc0c00000, 0xa8a9aaab, 0xacadaeaf, 0xb0b1b2b3, 0xb4b5b6b7, 0xb8b9babb, 0xbcbdbebf], [0xc0400000, 0xc0c00000, 0xa8a9aaab, 0xacadaeaf, 0xb0b1b2b3, 0xb4b5b6b7, 0xb8b9babb, 0xbcbdbebf], [0xc0400000, 0xc0c00000, 0xa8a9aaab, 0xacadaeaf, 0xb0b1b2b3, 0xb4b5b6b7, 0xb8b9babb, 0xbcbdbebf], [0xc0400000, 0xc0000000, 0xa8a9aaab, 0xacadaeaf, 0xb0b1b2b3, 0xb4b5b6b7, 0xb8b9babb, 0xbcbdbebf], [0xc0400000, 0xc0000000, 0xa8a9aaab, 0xacadaeaf, 0xb0b1b2b3, 0xb4b5b6b7, 0xb8b9babb, 0xbcbdbebf], [0xc0400000, 0xc0e00000, 0xa8a9aaab, 0xacadaeaf, 0xb0b1b2b3, 0xb4b5b6b7, 0xb8b9babb, 0xbcbdbebf], [0xc0400000, 0xc0e00000, 0xa8a9aaab, 0xacadaeaf, 0xb0b1b2b3, 0xb4b5b6b7, 0xb8b9babb, 0xbcbdbebf], [0xc0400000, 0xc0400000, 0xa8a9aaab, 0xacadaeaf, 0xb0b1b2b3, 0xb4b5b6b7, 0xb8b9babb, 0xbcbdbebf], [0xc0400000, 0xc0400000, 0xa8a9aaab, 0xacadaeaf, 0xb0b1b2b3, 0xb4b5b6b7, 0xb8b9babb, 0xbcbdbebf], [0xc0400000, 0xc0c00000, 0xa8a9aaab, 0xacadaeaf, 0xb0b1b2b3, 0xb4b5b6b7, 0xb8b9babb, 0xbcbdbebf], [0xc0400000, 0xc0c00000, 0xa8a9aaab, 0xacadaeaf, 0xb0b1b2b3, 0xb4b5b6b7, 0xb8b9babb, 0xbcbdbebf]]
