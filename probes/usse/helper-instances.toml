# usse helper instances: 0 sweeps, 2 probes.
needs = ["render"]

[[probe]]
name = "usse-helper-instances-helpers"
question = "which instances of the triangle's quads run an instruction without .skipinv (a scratch slot each) and whose o0 lands (the pixels)"
source = "pix_helpers.s"
host = "tri"
slot = "pixel"
size = [64, 64]
pixels = true
temps = 8
params = {  }
inputs = ["OUT"]
labels = ["run 1", "run 2", "run 3", "run 4", "run 5"]
cases = [["#0xFF00FF00"], ["#0xFF00FF00"], ["#0xFF00FF00"], ["#0xFF00FF00"], ["#0xFF00FF00"]]

