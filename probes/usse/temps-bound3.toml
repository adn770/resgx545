# usse the phas request bound (192 worked, 196 hung with --temps 8) for other start allocations: 0 sweeps, 3 probes.
needs = ["render"]

[[probe]]
name = "usse-temps-bound3-from032"
question = "a two-phase fill started with 32 temporaries whose phas asks for 192 and 196 for phase 1"
source = "temps_phas.s"
temps = 32
params = {  }
inputs = ["T", "HI", "MARK"]
labels = ["--temps 32; phas asks for 192 temporaries for phase 1; r123 written and read in phase 1", "--temps 32; phas asks for 196 temporaries for phase 1; r123 written and read in phase 1"]
cases = [["192", "123", "0x7E57007B"], ["196", "123", "0x7E57007B"]]
[probe.hypotheses]
"a phas request up to 255 fours (1020) works, the registers up to r123 are usable" = [{ o0 = 0x7E57007B }, { o0 = 0x7E57007B }]
"a phas request above 128 fails the job" = ["fail", "fail"]

