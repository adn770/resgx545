# usse destination bank 6: 0 sweeps, 3 probes (Q056).
needs = ["render"]

[[probe]]
name = "usse-destination-bank6-temps"
question = "where a write to destination bank 6 with a number whose low two bits are 0 (printed i.) lands: r0-r25, i0-i2 and the index registers (as r[il + #0], r[ih + #0]) read back"
source = "bank6_dump.s"
params = { OUT = "r0" }
inputs = ["OP"]
labels = ["control: r1 = marker, no bank 6 write", "bank 6 number 0 (printed i.)", "bank 6 number 4 (printed i.)", "bank 6 number 8 (printed i.)", "bank 6 number 16 (printed i.)", "bank 6 number 64 (printed i.)", "bank 6 number 124 (printed i.)", "bank 6 number 1 (i.l)", "bank 6 number 2 (i.h)", "bank 6 number 3 (i.lh)"]
cases = [["mov.skipinv r1, #0x00030002"], ["mov.skipinv r1, #0x00030002\n.long 0x2889100220000080 ; mov.skipinv bank 6 number 0, r1"], ["mov.skipinv r1, #0x00030002\n.long 0x2889100220800080 ; mov.skipinv bank 6 number 4, r1"], ["mov.skipinv r1, #0x00030002\n.long 0x2889100221000080 ; mov.skipinv bank 6 number 8, r1"], ["mov.skipinv r1, #0x00030002\n.long 0x2889100222000080 ; mov.skipinv bank 6 number 16, r1"], ["mov.skipinv r1, #0x00030002\n.long 0x2889100228000080 ; mov.skipinv bank 6 number 64, r1"], ["mov.skipinv r1, #0x00030002\n.long 0x288910022F800080 ; mov.skipinv bank 6 number 124, r1"], ["mov.skipinv r1, #0x00030002\n.long 0x2889100220200080 ; mov.skipinv bank 6 number 1, r1"], ["mov.skipinv r1, #0x00030002\n.long 0x2889100220400080 ; mov.skipinv bank 6 number 2, r1"], ["mov.skipinv r1, #0x00030002\n.long 0x2889100220600080 ; mov.skipinv bank 6 number 3, r1"]]

