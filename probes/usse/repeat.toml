"dest I1, src I0" = [0x23221110, 0x23221210, 0x23112110, 0x23221110, 0x23221110, 0x23221010, 0x23222111, 0x23221110, 0x23221110]
"dest I1, src I2" = [0x23221110, 0x23221110, 0x23112110, 0x23221210, 0x23221110, 0x23221110, 0x23222111, 0x23221010, 0x23221110]
"dest I1, src I3" = [0x23221110, 0x23221110, 0x23112110, 0x23221110, 0x23221210, 0x23221110, 0x23222111, 0x23221110, 0x23221010]
"dest I2, src I0" = [0x23221110, 0x23221210, 0x23221110, 0x23112110, 0x23221110, 0x23221010, 0x23221110, 0x23222111, 0x23221110]
