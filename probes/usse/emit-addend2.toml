# usse the emitpds addend in an interleaved order (item 14, E488): the base addend 0x100 between the others, one probe each (risky): 0 sweeps, 20 probes.
needs = ["render", "vm_low"]

[[probe]]
name = "usse-emit-addend2-p00-a00100"
question = "position 0: emitpds.tasks.taske #0, 2 rows, addend 0x100, naming the fill PDS secondary: dword 0 after the emit (3 or 2 if the program ran, 0x401 to 0x403 if the fill run only) and whether the job faults"
source = "emit_pds.s"
isa = "pds"
use = "emit_a00100.s"
low = 0x10000
coords = true
temps = 32
params = { SRC = "ir0.0" }
inputs = ["A"]
labels = ["addend 0x100, position 0"]
cases = [[0xC0DE0001]]

