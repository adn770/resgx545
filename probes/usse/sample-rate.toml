# usse sample rate: 0 sweeps, 20 probes.
needs = ["render", "kpoke"]

[[probe]]
name = "usse-sample-rate-aarate-control"
question = "the 4x triangle at the sample rate, the same words as the 4x triangle probes (one case per scanned bit)"
source = "pix_rate.s"
host = "tri"
slot = "pixel"
size = [64, 64]
pixels = true
params = { RATE = "sample" }
inputs = ["OP"]
cmd = { 1 = 0xe0000000, 10 = 0xeaa26e26, 13 = 0x80000002, 16 = 0xeaa26e26 }
cases = [["nop"]]
labels = ["main: sample rate"]

