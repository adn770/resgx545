# usse emits: 0 sweeps, 8 probes.
needs = ["render"]

[[probe]]
name = "usse-emits-emit-twopart-twopart"
question = "the vertex shader's emitvcbvtx.twopart and emitmtevtx.twopart: is the triangle drawn"
source = "vtx_emit.s"
host = "tri"
slot = "vtxuse"
size = [64, 64]
pixels = true
params = {  }
inputs = ["OP", "M"]
labels = ["vcb .twopart, mte .twopart"]
cases = [[".twopart", ".twopart"]]

