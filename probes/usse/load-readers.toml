# usse what reads a load's destination before the wdf: an ALU instruction, a later write, more than 32 slots: 0 sweeps, 3 probes.
# Run note: usse-load-readers-slots read NONE: its two hypotheses (the load never lands without a wdf; it landed) each
# failed in some of the 5 cases, one sample each (E517).
needs = ["render"]

[[probe]]
name = "usse-load-readers-alu"
question = "an ALU instruction reads the destination of a load that was not waited for, after n nop"
source = "fence.s"
temps = 48
params = {  }
inputs = ["FIRST", "SETUP", "OP", "POST", "END"]
labels = ["ldad r10 (drc0); 0 nop; ima32.u r11, r10, #1, r12; the result and r10 stored with no wdf", "ldad r10 (drc0); 1 nop; ima32.u r11, r10, #1, r12; the result and r10 stored with no wdf", "ldad r10 (drc0); 4 nop; ima32.u r11, r10, #1, r12; the result and r10 stored with no wdf", "ldad r10 (drc0); 16 nop; ima32.u r11, r10, #1, r12; the result and r10 stored with no wdf", "ldad r10 (drc0); 32 nop; ima32.u r11, r10, #1, r12; the result and r10 stored with no wdf", "ldad r10 (drc0); 48 nop; ima32.u r11, r10, #1, r12; the result and r10 stored with no wdf"]
