# items 6 and 7, risky: jumps through links, lapc targets, high bits; cases over 256 words dropped (phase 11.23)
# Dropped from the plan (the tool refuses programs of over 256 words): the absolute targets 255, 256,
# 257 and 300 of usse-risky-lapc-direct and usse-risky-lapc-computed, 4 cases each. Their question
# text ("absolute 255, 256, 257, 300") is kept as it ran, and is stale: the targets that ran are 1 to
# 100 instructions past the lapc (indices 30 to 129).
needs = ["render"]

[[probe]]
name = "usse-risky-link-ba-return"
question = "ba.savelink returned through lapc: the first time a link written by ba.savelink is jumped to (RISK: if the stored link is not the index after the call, lapc lands somewhere else and may hang; run usse-link-ba-savelink-read first)"
source = "dump.s"
params = { OUT = "r10", A = 0x00000000, B = 0x00000000, C = 0x00000000, D = 0x00000000, E = 0x00000000, F = 0x00000000, G = 0x00000000, H = 0x00000000 }
inputs = ["OP"]
labels = ["ba.savelink, routine reads the link, plain lapc returns", "ba.savelink, mov pclink, r13 (= RETY), 0 nop(s), lapc: r11 = 3 when the new link is used, 2 when the call's link still is", "ba.savelink, mov pclink, r13 (= RETY), 1 nop(s), lapc: r11 = 3 when the new link is used, 2 when the call's link still is", "ba.savelink, mov pclink, r13 (= RETY), 2 nop(s), lapc: r11 = 3 when the new link is used, 2 when the call's link still is"]
cases = [["mov r12, #R\nba.savelink #L\nR: mov r11, #2\nba #E\nL: mov r14, pclink\nlapc\nE: nop"], ["mov r12, #R\nmov r13, #RETY\nba.savelink #L\nR: mov r11, #2\nba #E\nRETY: mov r11, #3\nba #E\nL: mov r14, pclink\nmov pclink, r13\nlapc\nE: nop"], ["mov r12, #R\nmov r13, #RETY\nba.savelink #L\nR: mov r11, #2\nba #E\nRETY: mov r11, #3\nba #E\nL: mov r14, pclink\nmov pclink, r13\nnop\nlapc\nE: nop"], ["mov r12, #R\nmov r13, #RETY\nba.savelink #L\nR: mov r11, #2\nba #E\nRETY: mov r11, #3\nba #E\nL: mov r14, pclink\nmov pclink, r13\nnop\nnop\nlapc\nE: nop"]]
[probe.hypotheses]
"model: the link returns to the instruction after the call; a new pclink is used at once" = [[0xa0a1a2a3, 0x00000002, 0x00000013, 0xacadaeaf, 0x00000013], [0xa0a1a2a3, 0x00000003, 0x00000014, 0x00000016, 0x00000014], [0xa0a1a2a3, 0x00000003, 0x00000014, 0x00000016, 0x00000014], [0xa0a1a2a3, 0x00000003, 0x00000014, 0x00000016, 0x00000014]]

[[probe]]
name = "usse-risky-link-nested"
question = "a call inside a call: the routine saves pclink in r14, calls again, restores it and returns twice; r12 = 1 and r11 = 2 when both returns land (RISK: a wrong return loops or hangs)"
source = "dump.s"
params = { OUT = "r10", A = 0x00000000, B = 0x00000000, C = 0x00000000, D = 0x00000000, E = 0x00000000, F = 0x00000000, G = 0x00000000, H = 0x00000000 }
inputs = ["OP"]
labels = ["nested br.savelink calls, pclink saved in r14 and restored", "nested ba.savelink calls, pclink saved in r14 and restored"]
cases = [["mov r13, #0\nbr.savelink #3\nRET1: mov r12, #1\nba #E\nROUT1: mov r14, pclink\nbr.savelink #3\nRETA: mov pclink, r14\nlapc\nROUT2: mov r11, #2\nmov r15, pclink\nlapc\nE: nop"], ["mov r13, #0\nba.savelink #ROUT1\nRET1: mov r12, #1\nba #E\nROUT1: mov r14, pclink\nba.savelink #ROUT2\nRETA: mov pclink, r14\nlapc\nROUT2: mov r11, #2\nmov r15, pclink\nlapc\nE: nop"]]
[probe.hypotheses]
"model: both returns land; r14 = the first call's link, r15 = the second's" = [[0xa0a1a2a3, 0x00000002, 0x00000001, 0x00000000, 0x00000013, 0x00000017], [0xa0a1a2a3, 0x00000002, 0x00000001, 0x00000000, 0x00000013, 0x00000017]]

[[probe]]
