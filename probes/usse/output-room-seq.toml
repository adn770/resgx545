# Q023, Q012: the four-output setup after different jobs, three runs.
needs = ["render", "kpoke"]
name = "usse-output-room-seq"

[[probe]]
name = "usse-output-room-seq-after-size0-r1"
question = "the four-output setup after size0"
source = "pix_op.s"
host = "tri"
slot = "pixel"
slots = { pixpds = "pds_iter_xy.s", vtxuse = "vtx_coords.s" }
vtx_coords = 2
size = [0x40, 0x40]
pixels = true
inputs = ["OP"]
cases = [["or.skipinv o0, pa0, #1\nor.skipinv o1, pa0, #2\nor.skipinv o2, pa0, #3\nor.skipinv o3, pa0, #4\nor.skipinv o4, pa0, #5\nor.skipinv o5, pa0, #6\nor.skipinv o6, pa0, #7\nor.skipinv.end o7, pa0, #8"], ["or.skipinv o0, pa0, #1\nor.skipinv o1, pa0, #2\nor.skipinv o2, pa0, #3\nor.skipinv o3, pa0, #4\nor.skipinv o4, pa0, #5\nor.skipinv o5, pa0, #6\nor.skipinv o6, pa0, #7\nor.skipinv.end o7, pa0, #8"]]
labels = ["the job before", "isp0 bit 26, rd:9 = 1, size 3"]
case_set = [{ blk = { 1 = 0x5d00200, 4 = 1 }, kpoke = ["rd:9=0"] }, { blk = { 1 = 0x5d00200, 4 = 0x30001 }, kpoke = ["rd:9=1"] }]

