# usse loops below 65536 iterations: 0 sweeps, 10 probes (Q002).
needs = ["render"]

[[probe]]
name = "usse-loop-short-n8-1000"
question = "the host-clock time of the 8-instruction loop at 1000 iterations (below 65536), 5 runs"
source = "loop_count.s"
inputs = ["ITER"]
labels = ["1000 iterations", "1000 iterations", "1000 iterations", "1000 iterations", "1000 iterations"]
cases = [[1000], [1000], [1000], [1000], [1000]]

