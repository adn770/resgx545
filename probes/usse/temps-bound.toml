# usse phas requests above 128 (hangs the job at 256 and up in 11.24): 0 sweeps, 1 probes.
needs = ["render"]

[[probe]]
name = "usse-temps-bound-phas"
question = "a two-phase fill started with 8 temporaries whose phas asks for 132 to 252 for phase 1"
source = "temps_phas.s"
temps = 8
params = {  }
inputs = ["T", "HI", "MARK"]
labels = ["--temps 8; phas asks for 132 temporaries for phase 1; r123 written and read in phase 1", "--temps 8; phas asks for 136 temporaries for phase 1; r123 written and read in phase 1", "--temps 8; phas asks for 144 temporaries for phase 1; r123 written and read in phase 1", "--temps 8; phas asks for 160 temporaries for phase 1; r123 written and read in phase 1", "--temps 8; phas asks for 192 temporaries for phase 1; r123 written and read in phase 1", "--temps 8; phas asks for 224 temporaries for phase 1; r123 written and read in phase 1", "--temps 8; phas asks for 252 temporaries for phase 1; r123 written and read in phase 1"]
cases = [["132", "123", "0x7E57007B"], ["136", "123", "0x7E57007B"], ["144", "123", "0x7E57007B"], ["160", "123", "0x7E57007B"], ["192", "123", "0x7E57007B"], ["224", "123", "0x7E57007B"], ["252", "123", "0x7E57007B"]]
[probe.hypotheses]
"a phas request up to 255 fours (1020) works, the registers up to r123 are usable" = [{ o0 = 0x7E57007B }, { o0 = 0x7E57007B }, { o0 = 0x7E57007B }, { o0 = 0x7E57007B }, { o0 = 0x7E57007B }, { o0 = 0x7E57007B }, { o0 = 0x7E57007B }]
"a phas request above 128 fails the job" = ["fail", "fail", "fail", "fail", "fail", "fail", "fail"]
