# usse memory: 0 sweeps, 8 probes, hand-run script.
name = "usse-memory"
needs = ["render", "regs", "reset"]
script = "memory.sh"

[[probe]]
name = "usse-memory-mem-forms"
question = "the post-increment loads and stores, ldr of two id registers and a pclink round trip"
source = "dump.s"
params = { OUT = "r10" }
inputs = ["OP", "A", "B", "C", "D", "E", "F", "G", "H"]
labels = ["ldad [r20,#1++] twice from scratch dword 64; r12 = the pointer after", "stad [r20,#1++] of r1 then r2 to scratch dwords 64-65; r12 = the pointer after", "ldad [r20,#2++]: the increment in dwords; r12 = the pointer after", "ldr #7 and #8 (registers 0x001c and 0x0020, read-only ids)", "mov pclink, r1 then mov r10, pclink"]
cases = [["mov.skipinv r20, #0x5CAF0000\nor.skipinv r20, r20, #0x100\nldad.skipinv r10, [r20,#1++], drc0\nwdf drc0\nldad.skipinv r11, [r20,#1++], drc0\nwdf drc0\nmov.skipinv r12, r20", "0x00000123", "0x00000456", 0, 0, 0, 0, 0, 0], ["mov.skipinv r20, #0x5CAF0000\nor.skipinv r20, r20, #0x100\nstad.skipinv [r20,#1++], r1\nstad.skipinv [r20,#1++], r2\nidf drc0, bif\nwdf drc0\nmov.skipinv r12, r20", "0x00000123", "0x00000456", 0, 0, 0, 0, 0, 0], ["mov.skipinv r20, #0x5CAF0000\nor.skipinv r20, r20, #0x100\nldad.skipinv r10, [r20,#2++], drc0\nwdf drc0\nldad.skipinv r11, [r20,#2++], drc0\nwdf drc0\nmov.skipinv r12, r20", "0x00000123", "0x00000456", 0, 0, 0, 0, 0, 0], ["ldr.skipinv r10, #7, drc0\nwdf drc0\nldr.skipinv r11, #8, drc0\nwdf drc0", "0x00000123", "0x00000456", 0, 0, 0, 0, 0, 0], ["mov pclink, r1\nmov r10, pclink", "0x00000123", "0x00000456", 0, 0, 0, 0, 0, 0]]

