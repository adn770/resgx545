# item 6: the instruction index a program placed in the code heap sees (the link of a br.savelink in it),
# and a computed lapc forward in it. Phase 11.23 follow-up.
needs = ["render"]

[[probe]]
name = "usse-place-link-read-10000"
question = "the link of a br.savelink in a program placed at heap offset 0x10000 (cbase) read as o0 (no model: the placed program counts indices from the code base the start fixes)"
source = "place_base.s"
place = { offset = 0x10000, source = "place_link_read.s", form = "cbase" }
temps = 32
inputs = ["RUN"]
labels = ["run 1", "run 2"]
cases = [[1], [2]]

[[probe]]
name = "usse-place-link-jump-10000"
question = "a lapc to link + 8 computed at run time in a program placed at heap offset 0x10000 (cbase): o0 = the link when it lands, 0xFA11 when it falls through (no model: the placed program counts indices from the code base the start fixes)"
source = "place_base.s"
place = { offset = 0x10000, source = "place_link.s", form = "cbase" }
temps = 32
inputs = ["RUN"]
labels = ["run 1", "run 2"]
cases = [[1], [2]]

