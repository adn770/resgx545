# usse filter edges: 0 sweeps, 6 probes. firh with a loaded identity filter (set 0: the tap
# at the centre 1, shift 0, bias 0, 0x0a9c = 3) on a ramp line (bytes 0x10 to 0xc0) reads the
# position each centre lands on under rep, msc and mdc, centres -4 to 27 (E292); then sets 6
# and 7 with a load at 0x0a9c = 0, 1 and 2.
needs = ["render"]

