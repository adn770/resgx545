[[probe]]
name = "usse-integer-iadd32-value"
question = "iadd32 r4 = r1 + r2: a 32-bit sum or 16-bit lanes"
source = "value.s"
params = { OP = "iadd32.testtaz.chan0 r4, p0, r1, r2", OUT = "r4", C = 0, D = 0 }
inputs = ["A", "B"]
cases = [[0xffff, 1], [0x12345678, 0x11111111], [0xffffffff, 2], [0x7fffffff, 1]]
[probe.hypotheses]
"32-bit sum" = [0x10000, 0x23456789, 1, 0x80000000]
"16-bit lanes" = [0, 0x23456789, 0xffff0001, 0x7fff0000]
"sext16(r1) + r2" = [0, 0x11116789, 1, 0]

[[probe]]
name = "usse-integer-iaddu32-value"
question = "iaddu32 r4 = r1 + r2: a 32-bit sum or 16-bit lanes"
source = "value.s"
params = { OP = "iaddu32.testtaz.chan0 r4, p0, r1, r2", OUT = "r4", C = 0, D = 0 }
inputs = ["A", "B"]
cases = [[0xffff, 1], [0x12345678, 0x11111111], [0xffffffff, 2], [0x7fffffff, 1]]
[probe.hypotheses]
"32-bit sum" = [0x10000, 0x23456789, 1, 0x80000000]
"16-bit lanes" = [0, 0x23456789, 0xffff0001, 0x7fff0000]
"32-bit sum, saturating" = [0x10000, 0x23456789, 0xffffffff, 0x80000000]
"zext16(r1) + r2" = [0x10000, 0x11116789, 0x10001, 0x10000]

[[probe]]
name = "usse-integer-iaddu32-imm"
question = "iaddu32 r4 = #1 + r1 (the firmware's increment)"
source = "value.s"
params = { OP = "iaddu32.testtaz.chan0 r4, p0, #1, r1", OUT = "r4", B = 0, C = 0, D = 0 }
inputs = ["A"]
cases = [[0xffff], [0xffffffff], [0x7fffffff], [5]]
[probe.hypotheses]
"32-bit sum" = [0x10000, 0, 0x80000000, 6]
"32-bit sum, saturating" = [0x10000, 0xffffffff, 0x80000000, 6]

[[probe]]
name = "usse-integer-iadd32-z"
question = "iadd32 zero test: 32-bit result or low 16 bits"
source = "pred.s"
params = { OP = "iadd32.testtaz.chan0 !c0, p0, r1, r2", P = "p0", C = 0 }
inputs = ["A", "B"]
cases = [[0x10000, 0], [0x8000, 0x8000], [0, 0], [0x10001, 0xffffffff], [1, 0]]
[probe.hypotheses]
"r1 + r2 is 0" = [0, 0, 1, 0, 0]
"sext16(r1) + r2 is 0" = [1, 1, 1, 1, 0]

[[probe]]
name = "usse-integer-iadd32-n"
question = "iadd32 sign test n: bit 31, bit 15 or the exact sign"
source = "pred.s"
params = { OP = "iadd32.testnat.chan0 !c0, p0, r1, r2", P = "p0", C = 0 }
inputs = ["A", "B"]
cases = [[0x8000, 0], [0x80000000, 0], [0x7fffffff, 1], [0x7fff, 1]]
[probe.hypotheses]
"bit 31" = [0, 1, 1, 0]
"bit 15" = [1, 0, 0, 1]
"exact sign" = [0, 1, 0, 0]
"bit 31 of sext16(r1) + r2" = [1, 0, 0, 0]

[[probe]]
name = "usse-integer-iadd32-p"
question = "iadd32 sign test p (>= 0): on bit 31 or bit 15"
source = "pred.s"
params = { OP = "iadd32.testpat.chan0 !c0, p0, r1, r2", P = "p0", C = 0 }
inputs = ["A", "B"]
cases = [[0x8000, 0], [0x80000000, 0], [0, 0]]
[probe.hypotheses]
">= 0 on bit 31 of r1 + r2" = [1, 0, 1]
">= 0 on bit 31 of sext16(r1) + r2" = [0, 1, 1]

[[probe]]
name = "usse-integer-iaddu32-tests"
question = "iaddu32 tests: z, n and p on 16 or 32 bits"
source = "pred.s"
params = { P = "p0", C = 0 }
inputs = ["OP", "A", "B"]
cases = [["iaddu32.testtaz.chan0 !c0, p0, r1, r2", 0x10000, 0], ["iaddu32.testtaz.chan0 !c0, p0, r1, r2", 0xffffffff, 1], ["iaddu32.testnat.chan0 !c0, p0, r1, r2", 0x8000, 0], ["iaddu32.testnat.chan0 !c0, p0, r1, r2", 0x80000000, 0], ["iaddu32.testpat.chan0 !c0, p0, r1, r2", 0x80000000, 0], ["iaddu32.testpat.chan0 !c0, p0, r1, r2", 0, 0]]
labels = ["z 0x10000", "z 0xffffffff + 1", "n 0x8000", "n 0x80000000", "p 0x80000000", "p 0"]

[[probe]]
name = "usse-integer-ima16-imm-c"
question = "ima16.s r4, r1, #1, #2.neg (the firmware's form): is the immediate c in both lanes"
source = "value.s"
params = { OP = "ima16.s r4, r1, #1, #2.neg, u16, u16", OUT = "r4", B = 0, C = 0, D = 0 }
inputs = ["A"]
cases = [[0x50007], [1]]
[probe.hypotheses]
"both lanes" = [0x30005, 0xfffeffff]
"low lane only" = [0x50005, 0xffff]

[[probe]]
name = "usse-integer-ima16-reg-b"
question = "ima16.s r4, r1, r2, r3: lanes of a register b and c"
source = "value.s"
params = { OP = "ima16.s r4, r1, r2, r3, u16, u16", OUT = "r4", D = 0 }
inputs = ["A", "B", "C"]
cases = [[0x20005, 0x30004, 0x10001], [0x10001, 0x20003, 0x50007]]
[probe.hypotheses]
"lane by lane" = [0x70015, 0x7000a]
"b and c low lane in both" = [0x90015, 0x4000a]

[[probe]]
name = "usse-integer-iaddu32-np"
question = "iaddu32 sign tests n and p when the 32-bit sum has bit 31 set"
source = "pred.s"
params = { P = "p0", C = 0 }
inputs = ["OP", "A", "B"]
labels = ["n, 0 + 0x80000000", "p, 0 + 0x80000000", "n, 0xffff + 0xffff0000"]
cases = [["iaddu32.testnat.chan0 !c0, p0, r1, r2", 0, 0x80000000], ["iaddu32.testpat.chan0 !c0, p0, r1, r2", 0, 0x80000000], ["iaddu32.testnat.chan0 !c0, p0, r1, r2", 0xffff, 0xffff0000]]
[probe.hypotheses]
"bit 31 of the sum" = [1, 0, 1]
"unsigned: n never, p always" = [0, 1, 0]

[[probe]]
name = "usse-integer-iadd32-src1-imm"
question = "iadd32 r4 = #imm + r1 with a 16-bit immediate src1 (sign-extended?)"
source = "value.s"
params = { OP = "iadd32.testtaz.chan0 r4, p0, #1, r1", OUT = "r4", B = 0, C = 0, D = 0 }
inputs = ["A"]
cases = [[0xffffffff], [0x10000]]
[probe.hypotheses]
"1 + r1" = [0, 0x10001]
