# ta regions: 0 sweeps, 37 probes.
needs = ["render", "render_param", "render_tadata"]

[[probe]]
name = "ta-regions-scene-two"
question = "the TA's regions and streams for two copies of our triangle"
source = "pix_op.s"
host = "tri"
slot = "pixel"
vertices = 6
size = [64, 64]
pixels = true
inputs = ["OP"]
cases = [["mov.skipinv.end o0, o0"]]
labels = ["o0 = o0"]
dump_render = true

