# p1131 progs: the program files of the 11.31 scripts (stage-p1131.sh builds and stages them; the
# scripts give the render options themselves, one process per case). Written by
# gen/gen_templates.py.
needs = ["render"]

[[probe]]
name = "p1131-green"
question = "the plain green pixel shader"
source = "pix_green.s"
host = "tri"
slot = "pixel"
size = [64, 64]
pixels = true
inputs = []
labels = ["one"]
cases = [[]]

[[probe]]
name = "p1131-blue"
question = "a plain blue pixel shader (the first object's of the two-object streams)"
source = "pix_op.s"
host = "tri"
slot = "pixel"
size = [64, 64]
pixels = true
inputs = ["OP"]
labels = ["one"]
cases = [["mov.skipinv.end o0, #0xFF0000FF"]]

[[probe]]
name = "p1131-fmt-1"
question = "the pixel PDS program of E437 with the pa0 shader and the vertex program of 1 outputs"
source = "pds_iter_nofetch.s"
host = "tri"
slot = "pixpds"
slots = { pixel = "pix_pa0.s", vtxuse = "vtx_c1.s" }
size = [64, 64]
pixels = true
inputs = ["A", "B", "U"]
labels = ["source 0"]
cases = [[0x27000800, 0x0, 0x1000004]]

