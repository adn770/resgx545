[[probe]]
name = "p1131-psize"
question = "a vertex shader writing the case's size to the one coordinate output (as a float)"
source = "vtx_psize.s"
host = "tri"
slot = "vtxuse"
slots = { pixel = "pix_green.s" }
size = [64, 64]
pixels = true
inputs = ["V"]
labels = ["size 1.0", "size 8.0"]
cases = [[0x3F800000], [0x41000000]]

[[probe]]
name = "p1131-psizes"
question = "a vertex shader writing the case's size to the one coordinate output (as a float), 28 sizes"
source = "vtx_psize.s"
host = "tri"
slot = "vtxuse"
slots = { pixel = "pix_green.s" }
size = [64, 64]
pixels = true
inputs = ["V"]
labels = ["0.5", "1", "1.5", "2", "2.5", "3", "4", "5", "6", "7", "8", "9", "11", "12", "16", "20", "24", "32", "48", "63", "64", "100", "255", "256", "0.0625", "0.03125", "0", "-4"]
cases = [[0x3F000000], [0x3F800000], [0x3FC00000], [0x40000000], [0x40200000], [0x40400000], [0x40800000], [0x40A00000], [0x40C00000], [0x40E00000], [0x41000000], [0x41100000], [0x41300000], [0x41400000], [0x41800000], [0x41A00000], [0x41C00000], [0x42000000], [0x42400000], [0x427C0000], [0x42800000], [0x42C80000], [0x437F0000], [0x43800000], [0x3D800000], [0x3D000000], [0x00000000], [0xC0800000]]

[[probe]]
name = "p1131-psize2"
question = "a vertex shader writing A to o4 and B to o5 (two coordinate outputs)"
source = "vtx_psize2.s"
host = "tri"
slot = "vtxuse"
slots = { pixel = "pix_green.s" }
size = [64, 64]
pixels = true
inputs = ["A", "B"]
labels = ["2/6", "6/2"]
cases = [[0x40000000, 0x40C00000], [0x40C00000, 0x40000000]]

[[probe]]
name = "p1131-psizev"
question = "a vertex shader writing 16 * C + 20 to the one coordinate output, C = clip x (pa0) or clip y (pa1)"
source = "vtx_psizev.s"
host = "tri"
slot = "vtxuse"
slots = { pixel = "pix_green.s" }
size = [64, 64]
pixels = true
inputs = ["C"]
labels = ["by x", "by y"]
cases = [["pa0"], ["pa1"]]
