# ta objects: 0 sweeps, 28 probes.
needs = ["render", "render_param", "render_tadata"]

[[probe]]
name = "ta-objects-fbf-opaque"
question = "the TA's object for the position only (tri-fbf-opaque)"
source = "pix_op.s"
host = "tri"
slot = "pixel"
size = [64, 64]
pixels = true
inputs = ["OP"]
cases = [["mov.skipinv.end o0, o0"]]
labels = ["o0 = o0"]
dump_render = true

[[probe]]
name = "ta-objects-tex-fetch"
question = "the TA's object for one two-component set (tri-tex-fetch)"
source = "pds_tex.s"
host = "tri"
slot = "pixpds"
slots = { pixel = "pix_pa0.s", vtxuse = "vtx_coords.s" }
vtx_coords = 2
size = [64, 64]
pixels = true
inputs = ["A"]
cases = [[0x46012201]]
labels = ["DOUTI0 0x46012201"]
dump_render = true

