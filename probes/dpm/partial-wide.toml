# dpm partial wide: 1 probes (a script, partial-wide.sh).
# Q036: scenes of 100 to 500 triangles (probe --tri --vertices up to 1500) on a 4096x4096 and a
# 1024x768 target with parameter buffers of 0x422 to 0x23 pages, the DPM status registers, the
# TA3DCtl dword 36 and the page table after each.
needs = ["render", "render_param", "render_tadata", "render_pb_pages", "regs", "buf09"]
name = "dpm-partial-wide"
script = "partial-wide.sh"

[[probe]]
name = "dpm-partial-wide-green"
question = "the wide scenes' green pixel shader, the render memory dumped (the script's jobs run this shader)"
source = "pix_op.s"
host = "tri"
slot = "pixel"
dump_render = true
size = [0x40, 0x40]
inputs = ["OP"]
labels = ["green"]
cases = [["mov.skipinv.end o0, #0xFF00FF00"]]
