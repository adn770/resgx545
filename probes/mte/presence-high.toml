# mte presence high: 4 probes (written by tools/usse-asm/isp_words.py).
# the presence word's bits 16-31 (Q069).
needs = ["render"]

[[probe]]
name = "mte-presence-high-0"
question = "the presence word's bits 16-31 set one at a time"
source = "pix_op.s"
host = "tri"
slot = "pixel"
case_set = [{ blk = { 0 = 0x1df43 } }, { blk = { 0 = 0x2df43 } }, { blk = { 0 = 0x4df43 } }, { blk = { 0 = 0x8df43 } }]
size = [0x40, 0x40]
pixels = true
inputs = ["OP"]
labels = ["presence bit 16", "presence bit 17", "presence bit 18", "presence bit 19"]
cases = [["mov.skipinv.end o0, #0xFF00FF00"], ["mov.skipinv.end o0, #0xFF00FF00"], ["mov.skipinv.end o0, #0xFF00FF00"], ["mov.skipinv.end o0, #0xFF00FF00"]]

