[[row]]
id = "P37_F12b"
setting = "firmware"
declared = "control: 32 ldad.bypassl1 with no wdf, whose destinations were loaded with other values before, then 32 stad at once: at least 28 of the 32 stores read the OLD value (the wdf is needed in a task as in a fill, E517)"
