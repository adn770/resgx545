[[row]]
id = "P37_F14a"
setting = "firmware"
declared = "with all four slots armed (slots=0xf) and the slow task of slot 0 held for 0.7 ms (n = 10000, 2 jobs) and 6.5 ms (n = 100000, 3 jobs), ticks only and no job: the overlap flag of every slot stays 0, slots 1 to 3 count 0 passes, and at n = 100000 the passes of slot 0 counted are at least 2 fewer than the ticks the clock expects (ticks_expected, 0.997 per ms; E539 saw 1.9 to 2.2 behind) in at least 2 of 3 jobs, at n = 10000 none are missing (within 1)"
falsifier = "an overlap flag of 1, a pass in slot 1 to 3, or passes equal to the expected at n = 100000 in 2 of 3 jobs (no tick lost)"
expect = "5 of 5 jobs consistent"

[[row]]
