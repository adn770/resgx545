# phase 11.37 predictions (prepared, NOT RUN), frozen before any run: the sha256 of this file is in
# predictions-1137.sha256, the sha256 of every runnable file in manifest-1137.sha256.
# setting = "firmware" (an EDM task of ours, the landed verifier) or "client" (a pixel task, a fill).
# A client row does not answer the firmware part of its item.  The risky stages are last (f15, f14*).

[[row]]
id = "P37_F8"
setting = "firmware"
declared = "In a firmware task, with p0 set from the job's P before a gap (none, 1, 4, 16 or 64 mov limm, 1, 4, 16 or 32 ldad.bypassl1 and one wdf, a mix, wdf+idf+wdf, a taken br hop), `p0 mov r20,#A` writes iff P != 0 (else r20 keeps the job's marker M1), `!p0 mov r21,#B` writes iff P == 0 (else M2), `p0 br` is taken iff P != 0 and `!p0 br` iff P == 0: 72 of 72 jobs (12 gaps x P in 0,1 x 3 repeats, shuffled, markers and the branch codes per job)"
falsifier = "any job whose r20..r23 differ from that: p0 lost over some gap, a predicated mov limm that ignores p0, a stale marker"
expect = "72 of 72"

[[row]]
id = "P37_F10a"
setting = "firmware"
declared = "xor.testtanz.chan0 !c0, p0, rV, #n encodes every n from 0 to 127 exactly and zero-extended: with V_n = n all 128 p0 false; with V_n = n ^ (1 << (n mod 32)) and V_n = n ^ (1 << ((n + 16) mod 32)) all 128 true; with V_n = n | 0xffffff80 all 128 true (no sign extension of the 7-bit field)"
falsifier = "any p0 other than that (an n read as another value, or sign-extended: n >= 64 would read false in the last job)"
expect = "4 of 4 jobs"

[[row]]
id = "P37_F10b"
setting = "firmware"
declared = "a value of 128 and up reaches a test through mov rK, #W (limm) then xor.testtanz.chan0 !c0, p0, rV, rK: every one of the 64 W (128 .. 0xffffffff, the limm field boundaries 20/21 and 25/26 included) is exact: V = W gives p0 false 64 of 64, V = W with one bit flipped gives p0 true 64 of 64 in two jobs of different flipped bits"
falsifier = "any W read as another value"
expect = "3 of 3 jobs"

[[row]]
id = "P37_F11a"
setting = "firmware"
declared = "in a TRC 31 task started with 124 temporaries, each register of r1..r123 outside the wrapper's own (112 of them, regsA) takes a write of its own per-job marker (loaded from the page) and reads it back, separately, written one range at a time first (r1..r31, r32..r63, r64..r95, r96..r123: cmds 3 to 6) and then all at once (cmd 1): 15 of 15 jobs (5 commands x 3 repeats) with every register of the job equal to its marker and none equal to another register's marker or to a marker of an earlier job"
falsifier = "any register that reads something else (a stale value of an earlier job, another register's marker, 0)"
expect = "15 of 15 jobs, 112 of 112 registers in the all-at-once job"

[[row]]
id = "P37_F11b"
setting = "firmware"
declared = "the registers of regsA's wrapper (r1..r7, r9..r11, r30) and r8 do the same from a wrapper that uses r12..r22 (regsB): 3 of 3 jobs, 12 of 12"
falsifier = "any of the 12 reads something else"
expect = "3 of 3 jobs"

