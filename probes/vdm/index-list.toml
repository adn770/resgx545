# vdm index list: 0 sweeps, 7 probes.
needs = ["render", "render_param", "render_tadata"]

[[probe]]
name = "vdm-index-list-idx-w4-0"
question = "five copies with the index list's word 4 = 0x0"
source = "pix_op.s"
host = "tri"
slot = "pixel"
vertices = 15
size = [64, 64]
pixels = true
inputs = ["OP"]
cases = [["mov.skipinv.end o0, o0"]]
labels = ["o0 = o0"]
vdm = { 4 = 0 }
dump_render = true

