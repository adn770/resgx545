# vdm state2 fields: 1 probe.
# Q047: a stream of two objects (sgxfive-test probe --tri ... --obj2 6, 12 vertices), each with
# its own state block (VDM words 0-1 and 8-9) and pixel shader (blue first, green second), the
# fields of one block's state word flipped at a time, the other block as built: bit 8, bits 11:9
# at 0 to 7 and bits 15:13 at 0 to 7 (the job's 2 and 1 are the control), with the render's PB and
# TA data dumped and the pixels read.
