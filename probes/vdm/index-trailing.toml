# vdm index trailing: 7 probes (written once for 11.15, not regenerated).
# Q042, Q092, Q047, Q070: the index list's trailing word and header, and the state word, on the
# five-copy job.
needs = ["render", "render_param", "render_tadata"]
name = "vdm-index-trailing"

