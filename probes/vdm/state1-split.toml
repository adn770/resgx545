# vdm state1 split: 3 probes (written by tools/usse-asm/ta_words.py).
# Q015: the sweep's bits 11:9 = 7 split three ways
needs = ["render", "render_param", "render_tadata"]
name = "vdm-state1-split"
script = "state1-split.sh"

[[probe]]
name = "vdm-state1-split-green"
question = "VDM state word 1 bits 11:9 = 7 on the probe's triangle with a shader writing its colour, pixels read, render dumped"
source = "pix_op.s"
host = "tri"
slot = "pixel"
vdm = { 1 = 0xa022e05 }
dump_render = true
size = [0x40, 0x40]
pixels = true
inputs = ["OP"]
labels = ["green"]
cases = [["mov.skipinv.end o0, #0xFF00FF00"]]

[[probe]]
name = "vdm-state1-split-op-plain"
question = "the same with o0 copied (the original probe's shader), no pixel readback, no render dump"
source = "pix_op.s"
host = "tri"
slot = "pixel"
vdm = { 1 = 0xa022e05 }
size = [0x40, 0x40]
pixels = false
inputs = ["OP"]
labels = ["o0 = o0"]
cases = [["mov.skipinv.end o0, o0"]]

[[probe]]
name = "vdm-state1-split-op"
question = "the original probe: o0 copied, pixels read, render dumped"
source = "pix_op.s"
host = "tri"
slot = "pixel"
vdm = { 1 = 0xa022e05 }
dump_render = true
size = [0x40, 0x40]
pixels = true
inputs = ["OP"]
labels = ["o0 = o0"]
cases = [["mov.skipinv.end o0, o0"]]
