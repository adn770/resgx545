    "pred=PRED_MUL 58:57", "off=INT_OFF 38", "flags=F_MULFLAGS", "dst=F_INT_D10",
    "cx=INT_X4 40:39", "src1=K_INT_SC10 13:7 31:30 49 43", "src2=K_INT_SC10 6:0 29:28 48 47",
    "aop=INT_AADD 36", "ax=INT_X4 17:16", "asel=K_INT_DOTADD 53:52 34 15 42:41 35",
]

