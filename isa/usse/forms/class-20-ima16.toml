    "abs=F_ABS 56", "src0=F_MSRC0",
    "src1x=K_INT_SLH 13:7 31:30 49 52", "src2x=FD_RM2(K_INT_SNEG)",
    "fmt=FD_SOP(K_INT_FMT16_1)",
]

