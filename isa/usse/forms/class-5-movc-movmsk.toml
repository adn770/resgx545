    "pred=PRED_ALL 58:56", "flags=MSC_C5FLAGS", "type=MSC_MOVC_TR 42:40", "repeat=REPEAT 47:44",
    "test=MSC_MOVC_TEST 39 54", "dst=F_DST", "src0=F_MSRC0", "src1=F_SRC1D", "src2=F_SRC2D",
]

