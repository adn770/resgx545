# ---- class 5: movc, movmsk
[[form]]
order = 1880
pat = "{0}movc{1}{2}{3} {4}{5}, {6}, {7}, {8}"
op = "movc"
mask = "CLSM | b(53)"
val = "cls(5)"
fields = [
    "pred=PRED_ALL 58:56", "flags=MSC_C5FLAGS", "type=MSC_MOVC_T 42:40",
    "test=MSC_MOVC_TEST 39 54", "dst=F_DST", "mask=WMASK 47:44", "src0=F_MSRC0", "src1=F_SRC1D",
    "src2=F_SRC2D",
]

