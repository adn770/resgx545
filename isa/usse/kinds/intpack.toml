    { t = ["zero", "s0a", "s1a", "s2a"], comp = true },
    { t = ["zero", "asat", "s1", "s1a", "s0", "s0a", "s2", "s2a"], comp = true },
    { t = ["add", "sub"], comp = false },
]

[kind.K_INT_ARSOP]
sel = [
    { t = ["zero", "s0a", "s1a", "s2a"], comp = true },
    { t = ["add", "sub"], comp = false },
]

[kind.K_INT_ALRP]
sel = [
    { t = ["zero", "s1a"], comp = true },
    { t = ["zero", "s2a"], comp = true },
]

[kind.K_INT_LRP1C]
sel = [
    { t = ["zero", "s1"], comp = true },
    { t = ["zero", "s2"], comp = true },
    { t = ["s0", "s0a"], comp = false },
]

[kind.K_INT_LRP1A]
sel = [
    { t = ["zero", "asat", "s1", "s1a", "s0", "s0a", "s2", "s2a"], comp = true },
    { t = ["zero", "asat", "s1", "s1a", "s0", "s0a", "s2", "s2a"], comp = true },
    { t = ["add", "sub"], comp = false },
