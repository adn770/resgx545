[kind.K_INT_IMA8SEL]
sel = [
    { t = ["s0", "s1", "s0a", "s1a"], comp = true },
    { t = ["s1", "s1a"], comp = true },
    { t = ["s2", "s2a"], comp = true },
    { t = ["s0a", "s1a"], comp = true },
    { t = ["s1a"], comp = true },
    { t = ["s2a"], comp = true },
]

[kind.K_INT_DOTADD]
sel = [
    { t = ["zero", "s1a", "s2a", false], comp = true },
    { t = ["s1a"], comp = true },
    { t = ["zero", "s1a", "s2a", false], comp = true },
