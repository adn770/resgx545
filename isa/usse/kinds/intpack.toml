# USSE forms, the intpack family (classes 8, 14, 16-21, 24, 26).
# The source of the C and Rust tables: see isa/README.md.

# Kinds written as code, in both languages (C: tools/usse-dis, Rust: crates/usse-isa).
code = [
    "K_INT_SRCC",
    "K_INT_SRCC0",
    "K_INT_PCKOP",
    "K_INT_STATOMIC",
    "K_INT_D10",
    "K_INT_S10",
    "K_INT_S0_10",
    "K_INT_S0LH",
    "K_INT_SLH",
    "K_INT_SNEG",
    "K_INT_SNLH",
    "K_INT_IMAEC",
    "K_INT_CIE32",
    "K_INT_IMA32X",
    "K_INT_S0N_10",
    "K_INT_SC10",
    "K_INT_FMT16_0",
    "K_INT_FMT16_1",
    "K_INT_FMT16_2",
    "K_INT_FMT16_3",
]

[layout]
INT_PCKOP = "43:38 55 52 54 50 18"
INT_S1C = "13:7 31:30 49 17:16"
INT_S2C = "6:0 29:28 48 15:14"

[field]
F_INT_D10 = "DST(K_INT_D10)"
F_INT_S1_10 = "SRC1(K_INT_S10)"
F_INT_S2_10 = "SRC2(K_INT_S10)"
F_INT_S0_10 = "SRC0P(K_INT_S0_10)"
F_INT_ALRP = "K_INT_ALRP 45 41 44 46"

[kind.INT_BYTEMASK]
enum = [".enone", ".e0", ".e1", ".e0.e1", ".e2", ".e0.e2", ".e1.e2", ".e0.e1.e2", ".e3", ".e0.e3", ".e1.e3", ".e0.e1.e3", ".e2.e3", ".e0.e2.e3", ".e1.e2.e3", ""]

[kind.INT_ROUND]
enum = ["nearest", "down", "up", "zero"]

[kind.INT_BYTEMASK4]
enum = [".enone", ".e0", ".e1", ".e0.e1", ".e2", ".e0.e2", ".e1.e2", ".e0.e1.e2", ".e3", ".e0.e3", ".e1.e3", ".e0.e1.e3", ".e2.e3", ".e0.e2.e3", ".e1.e2.e3", ".e0.e1.e2.e3"]

[kind.INT_SAT]
enum = ["", ".sat"]

# ---- class 24: u8dot3, u8dot4, u16dot3, u16dot4 (and their off forms)
[kind.INT_DOTFMT]
enum = ["u8", "u8", "u8", "u16"]

# ENUM(INT_DOTFMT, 4, "u8", "u8", "u8", "u16");      /* enc[53:52]
[kind.INT_X4]
enum = ["1", "2", "4", "8"]

[kind.INT_OFF]
enum = ["", "off"]

[kind.INT_NOT3]
enum = ["", "", ""]

[kind.INT_AADD]
enum = ["aadd", "asub"]

[kind.INT_AINTRP]
enum = ["alrp", "alrpc"]

[kind.K_INT_SOP2C]
pre = true
sel = [
    { t = ["zero", "s1", "s2", "s1a", "s2a", "asat", "s2scale", false], comp = true },
    { t = ["zero", "s1", "s2", "s1a", "s2a", "asat", "zeros", false], comp = true },
    { t = ["add", "sub", "min", "max"], comp = false },
]

[kind.K_INT_SOP2A]
pre = true
neg = true
sel = [
    { t = ["zero", "s1a", "s2a", "s2scale"], comp = true },
    { t = ["zero", "s1a", "s2a", "zeros"], comp = true },
    { t = ["add", "sub", "min", "max"], comp = false },
]

[kind.K_INT_SOP3C]
sel = [
    { t = ["zero", "asat", "s1", "s1a", "s0", "s0a", "s2", "s2a"], comp = true },
    { t = ["zero", "asat", "s1", "s1a", "s0", "s0a", "s2", "s2a"], comp = true },
    { t = ["add", "sub"], comp = false },
]

[kind.K_INT_SOP3CN]
neg = true
sel = [
    { t = ["zero", "asat", "s1", "s1a", "s0", "s0a", "s2", "s2a"], comp = true },
    { t = ["zero", "asat", "s1", "s1a", "s0", "s0a", "s2", "s2a"], comp = true },
    { t = ["add", "sub"], comp = false },
]

[kind.K_INT_ASOP]
