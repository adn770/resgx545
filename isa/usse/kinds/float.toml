# USSE forms, the float family (classes 0-4, 6, 7, 25, 27).
# The source of the C and Rust tables: see isa/README.md.

# Kinds written as code, in both languages (C: tools/usse-dis, Rust: crates/usse-isa).
code = [
    "K_FLT_SRC",
    "K_FLT_SRC0",
    "K_FLT_SRC0_NP",
    "K_FLT_SRC_MAD16",
    "K_FLT_SRC0_MAD16",
    "K_FLT_SRC_FLR16",
    "K_FLT_SRC0_FLR16",
    "K_FLT_INCS",
    "K_FLT_FLAGS",
    "K_FLT_DST",
    "K_FLT_MODS1",
    "K_FLT_FLAGS1",
    "K_FLT_M16",
    "K_FLT_M16A",
    "K_FLT_REP16",
    "K_FLT_FLAGS3",
    "K_FLT_EFO_S0",
    "K_FLT_EFO_S1",
    "K_FLT_EFO_S2",
    "K_FLT_EFO_FLAGS",
    "K_FLT_EFO_IW",
    "K_FLT_EFO_ADD",
    "K_FLT_C10_DST",
    "K_FLT_C10_S0",
    "K_FLT_C10_SRC",
    "K_FLT_PMA_FLAGS",
    "K_FLT_PMA_CSEL",
    "K_FLT_PMA_ASEL",
    "K_FLT_SRCH",
    "K_FLT_SRC_FLR16H",
    "K_FLT_POP4",
    "K_FLT_POP4M",
    "K_FLT_POP4F",
    "K_FLT_POPMOV",
    "K_FLT_POPDDP",
    "K_FLT_POPSSQ",
    "K_FLT_REF_S0_32",
    "K_FLT_REF_S1_32",
    "K_FLT_REF_S2_32",
    "K_FLT_REF_S0_MAD",
    "K_FLT_REF_S1_MAD",
    "K_FLT_REF_S2_MAD",
    "K_FLT_REF_S0_FLR",
    "K_FLT_REF_S1_FLR",
    "K_FLT_REF_S2_FLR",
    "K_FLT_REF_M0_32H",
    "K_FLT_REF_M1_32H",
    "K_FLT_REF_M2_32H",
    "K_FLT_REF_M0_FLRH",
    "K_FLT_REF_M1_FLRH",
    "K_FLT_REF_M2_FLRH",
    "K_FLT_SRC0_L0",
    "K_FLT_SRC_L1",
    "K_FLT_SRC_L2",
