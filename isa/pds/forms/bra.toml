# ---- flow: bra/call name an instruction index counted from the first instruction after
# the data segment.
[[form]]
order = 2380
pat = "{0}bra {1}"
op = "bra"
mask = "OPM"
val = "0x12 << 27"
fields = ["pred=PRED", "target=K_HEX 23:0"]
